  var T0={rev:0,cogs:0,waste:0,com:0,gross:0,afterW:0,net:0};rows.forEach(function(r){for(var k in T0)T0[k]=r2(T0[k]+r[k])});
  h.push('<div class="card"><h2>🏷️ กำไรแยกแบรนด์ · หลังหักของเสีย <span class="mu">('+ym+')</span></h2><div class="tw"><table><thead><tr><th>แบรนด์</th>'+
   '<th class="num">ยอดขาย</th><th class="num">กำไรขั้นต้น</th><th class="num">ของเสีย</th><th class="num">กำไรหลังหักของเสีย</th><th class="num">ค่าคอม</th><th class="num">เหลือ</th><th class="num">%</th></tr></thead><tbody>');
  function row(r,bold){return '<tr'+(bold?' style="background:#f8fafc;font-weight:800"':'')+'><td>'+(bold?'รวม':'<b>'+E(r.name)+'</b>')+'</td><td class="num">'+B(r.rev)+'</td><td class="num">'+B(r.gross)+
   '</td><td class="num" style="color:var(--rd)">'+(r.waste?'-'+B(r.waste):'-')+'</td><td class="num" style="color:var(--gr)">'+B(r.afterW)+'</td><td class="num" style="color:var(--pu)">'+(r.com?'-'+B(r.com):'-')+
   '</td><td class="num" style="font-weight:700;color:'+(r.net>=0?'var(--gr)':'var(--rd)')+'">'+B(r.net)+'</td><td class="num mu">'+(r.rev?r2(r.net/r.rev*100):0)+'%</td></tr>'}
  if(rows.length){rows.forEach(function(r){h.push(row(r))});h.push(row(T0,true))}
  else h.push('<tr><td colspan="8" class="emp">ไม่มีข้อมูลเดือนนี้</td></tr>');
  h.push('</tbody></table></div><p class="mu" style="margin-top:8px">เหลือ = กำไรขั้นต้น − ของเสีย − ค่าคอม/โบนัส (ยังไม่หักรายจ่ายดำเนินงานอื่น ซึ่งไม่ผูกกับแบรนด์) · ยอดรวมของคอลัมน์ "เหลือ" ตรงกับงบด้านบนก่อนหักรายจ่ายอื่น</p></div>');
  return html+h.join('')};

 /* ══════════ แก้ของเดิม ③ ค่าคอมรายวัน / รายเดือน ══════════ */
 function commPeriod(){
  if(!can('comm.read'))return '';
  var mode=S.cmv||'D',ym=curYM(),h=[],list=db.comms.filter(function(c){return !c.void});
  h.push('<div class="card"><h2>📆 ค่าคอม '+(mode==='D'?'รายวัน':'รายเดือน')+' <span class="sp"></span>'+
   '<span class="pill'+(mode==='D'?' on':'')+'" onclick="S.cmv=\'D\';render()">รายวัน</span><span class="pill'+(mode==='M'?' on':'')+'" onclick="S.cmv=\'M\';render()">รายเดือน</span></h2>');
  var g={},keyf;
  if(mode==='D'){h.push('<div style="margin-bottom:8px">'+monthSelect()+'</div>');list=list.filter(function(c){return DAY(c.at).slice(0,7)===ym});keyf=function(c){return DAY(c.at)}}
  else keyf=function(c){return DAY(c.at).slice(0,7)};
  list.forEach(function(c){var k=keyf(c),x=g[k]=g[k]||{bills:{},sale:0,com:0,bon:0,sum:0,paid:0,rep:{}};
   x.bills[c.sid]=1;x.sale+=c.tot;x.com+=c.com;x.bon+=c.bon;x.sum+=c.sum;if(c.paid)x.paid+=c.sum;x.rep[c.emp]=(x.rep[c.emp]||0)+c.sum});
  var ks=Object.keys(g).sort().reverse().slice(0,mode==='D'?31:12);
  h.push('<div class="tw"><table><thead><tr><th>'+(mode==='D'?'วันที่':'เดือน')+'</th><th class="num">บิล</th><th class="num">ยอดขาย</th><th class="num">คอม</th><th class="num">โบนัส</th><th class="num">รวม</th><th class="num">ค้างจ่าย</th><th>แยกตามเซลล์</th></tr></thead><tbody>');
  if(ks.length)ks.forEach(function(k){var x=g[k],rk=Object.keys(x.rep).sort(function(a,b){return x.rep[b]-x.rep[a]});
   h.push('<tr><td><b>'+(mode==='D'?WDd(k)+' '+k.slice(8)+'/'+k.slice(5,7):monthLabel(k))+'</b></td><td class="num">'+Object.keys(x.bills).length+'</td><td class="num">'+B(x.sale)+'</td><td class="num">'+B(x.com)+
    '</td><td class="num">'+B(x.bon)+'</td><td class="num" style="font-weight:700">'+B(x.sum)+'</td><td class="num" style="color:'+(x.sum-x.paid>0.004?'var(--rd)':'var(--gr)')+'">'+B(r2(x.sum-x.paid))+
    '</td><td class="mu" style="font-size:12px">'+rk.map(function(n){return E(n)+' '+B(x.rep[n])}).join(' · ')+'</td></tr>')});
  else h.push('<tr><td colspan="8" class="emp">ยังไม่มีข้อมูล</td></tr>');
  return h.join('')+'</tbody></table></div></div>'}
 function WDd(d){try{return WD(d)}catch(e){return ''}}
 var oldComm=VIEWS.comm;
 VIEWS.comm=function(){return oldComm.apply(this,arguments)+commPeriod()};

 /* ══════════ แก้ของเดิม ① เตือนเช้าทุกวัน (แสดงครั้งแรกที่เปิดแอปของวัน) ══════════ */
 function morning(){
  try{
   if(!me||!db||$('mod')||S.page==='login')return;
   var td=DAY();if(ST.g('v8morn')===td)return;
   var lots=nearExp(db.cfg.expWarn||3),od=arOverdue();
   ST.s('v8morn',td);
   if(!lots.length&&!od.length)return;
   var h=[];
   if(lots.length){h.push('<div class="sec">⏰ สินค้าใกล้หมดอายุ (ภายใน '+(db.cfg.expWarn||3)+' วัน)</div><div class="tw"><table style="min-width:auto;font-size:12.5px"><tbody>');
    lots.slice(0,12).forEach(function(l){var dd=dDiff(td,l.exp);
     h.push('<tr><td>'+E(P(l.pid).name)+'<div class="mu">ล็อต '+E(l.lot||'-')+'</div></td><td class="num">'+Q(l.rem)+'</td><td class="num" style="color:var(--rd);font-weight:700">'+(dd<0?'หมดแล้ว '+(-dd)+' วัน':(dd===0?'วันนี้':'อีก '+dd+' วัน'))+'</td></tr>')});
    h.push('</tbody></table></div>'+(lots.length>12?'<p class="mu">…และอีก '+(lots.length-12)+' ล็อต</p>':''))}
   if(od.length){var by={};od.forEach(function(a){by[a.cid]=r2((by[a.cid]||0)+arRem(a))});
    h.push('<div class="sec">💳 ลูกหนี้เกินกำหนด ('+Object.keys(by).length+' ร้าน)</div>'+Object.keys(by).slice(0,8).map(function(k){
     return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>'+E(CU(k).name)+'</span><b style="color:var(--rd)">'+B(by[k])+'</b></div>'}).join(''))}
   modal('🌅 แจ้งเตือนประจำเช้า — '+td,h.join(''))
  }catch(e){}}
 var oldRender=window.render;
 window.render=function(){oldRender.apply(this,arguments);morning()};
 render=window.render;

 /* ---------- routing ---------- */
 VIEWS.promo=vPromo;VIEWS.plan=vPlan;
 var ix=-1;PAGES.forEach(function(x,i){if(x[0]==='zrep')ix=i});
 [['promo','🎁 โปร & ขั้นต่ำ'],['plan','🗓️ แผนส่ง']].forEach(function(p,k){
  if(PAGES.some(function(x){return x[0]===p[0]}))return;
  if(ix<0)PAGES.splice(Math.max(0,PAGES.length-2),0,p);else PAGES.splice(ix+1+k,0,p)});

 /* ---------- self-tests ---------- */
 function extraTests(){
  var out=[],pr={id:'P1',brand:'X'},ps=[{id:'a',name:'ลด10%',scope:'ALL',type:'PCT',val:10,minQty:0,active:true},
   {id:'b',name:'ลด5บาท',scope:'PRODUCT',ref:'P1',type:'BAHT',val:5,minQty:12,active:true},
   {id:'c',name:'หมดเขต',scope:'ALL',type:'PCT',val:50,to:'2000-01-01',active:true}];
  function TT(n,fn){try{fn();out.push({n:n,ok:true})}catch(e){out.push({n:n,ok:false,m:e.message})}}
  TT('50. โปรโมชั่น: เลือกโปรที่ลดมากสุด และข้ามโปรหมดเขต',function(){var b=bestPromo(pr,1,100,ps,'2026-06-01');
   if(!b||b.p.id!=='a'||b.d!==10)throw Error('ผิด '+JSON.stringify(b))});
  TT('51. โปรโมชั่น: เงื่อนไขซื้อขั้นต่ำต่อรายการ',function(){var p2=[ps[1]];
   if(bestPromo(pr,11,100,p2,'2026-06-01'))throw Error('ไม่ควรได้โปร');var b=bestPromo(pr,12,100,p2,'2026-06-01');if(!b||b.d!==5)throw Error('ควรลด 5')});
  TT('52. โปรโมชั่น: ส่วนลดไม่เกินราคา',function(){if(promoDisc({scope:'ALL',type:'BAHT',val:500},pr,1,100)!==100)throw Error('ลดเกินราคา')});
  return out}
 try{TESTS=(TESTS||[]).concat(extraTests())}catch(e){}
 setTimeout(function(){try{if(window.db){migrate();if($('app')&&!$('app').classList.contains('hide'))render()}}catch(e){}},350);
 console.log('%c✅ v8.0 promotions / min order / delivery plan / real-time / P&L brand loaded','color:#059669;font-weight:bold');
})();
</script>

<script>
/* ═══ v9.0 — เงินค้ำพนักงาน / ค่าเช่ารถ / ค่างวดรถ แยกรายคน ═══
   4 บัญชีต่อคน: DEP เงินค้ำ(หนี้สิน) · RENT ค่าเช่า · REP ค่าซ่อม/เสียหาย · LOAN ค่างวดรถ
   รับเงินครั้งเดียวแยกสัดส่วนได้ → ลงสมุดบัญชีเงินแยกบรรทัดตามหมวด (แก้ปัญหาบัญชีปนกัน) */
(function(){
'use strict';
if(typeof db==='undefined'||typeof VIEWS==='undefined'||typeof PAGES==='undefined')return;
var oldMig=window.migrate;
window.migrate=function(){oldMig.apply(this,arguments);if(!db)return;
 var f=db.fleet=db.fleet||{};['ppl','cars','use','led','loans'].forEach(function(k){if(!f[k])f[k]=[]});
 if(!f.cfg)f.cfg={a1:3,a2:7,t1:100,t2:75,t3:50};
 if(db.exCats&&db.exCats.indexOf('ซ่อมรถพนักงาน')<0)db.exCats.push('ซ่อมรถพนักงาน')};
migrate=window.migrate;
PERM['fleet.read']=['OWNER','ACCOUNTING'];PERM['fleet.write']=['OWNER','ACCOUNTING'];PERM['fleet.admin']=['OWNER'];
ATH.FLEET='เงินค้ำ/ค่าเช่ารถ/ค่างวด';
var BN={DEP:'เงินค้ำ',RENT:'ค่าเช่ารถ',REP:'ค่าซ่อม/ความเสียหาย',LOAN:'ค่างวดรถ'},BC={DEP:'g-p',RENT:'g-b',REP:'g-a',LOAN:'g-g'},
 SRC={DEP:'เงินค้ำพนักงาน',RENT:'ค่าเช่ารถพนักงาน',REP:'ค่าซ่อมรถ(เรียกคืน)',LOAN:'ค่างวดรถพนักงาน'};
function F(){return db.fleet}
function pp(id){return F().ppl.filter(function(x){return x.id===id})[0]}
function cr(id){return F().cars.filter(function(x){return x.id===id})[0]||{plate:'—',name:''}}
function fb(pid,b){return r2(SUM(F().led.filter(function(e){return e.pid===pid&&e.b===b&&!e.void}),function(e){return e.amt}))}
function tot(b){return r2(SUM(F().ppl,function(p){return fb(p.id,b)}))}
function loanOf(pid){var l=F().loans.filter(function(x){return x.pid===pid});return l[l.length-1]}
function addM(d,k){var x=new Date(d+'T12:00:00+07:00');x.setMonth(x.getMonth()+k);return DAY(x)}
function nextDue(pid){var l=loanOf(pid),o=l?fb(pid,'LOAN'):0;if(!l||o<=0.005)return null;
 var k=Math.floor((l.fin-o+0.005)/l.amt);return addM(l.start,k)}
function overdue(pid){var d=nextDue(pid);return !!d&&d<DAY()}
function suggest(year){var c=F().cfg,y=Number(year)||0;if(y>2400)y-=543;var a=new Date().getFullYear()-y;
 return a<=c.a1?c.t1:a<=c.a2?c.t2:c.t3}
function ent(o){var e={id:uid(),no:docNo('FL'),at:NOW(),date:o.date||DAY(),pid:o.pid,b:o.b,k:o.k,amt:r2(o.amt),
 rc:o.rc||'',note:o.note||'',mids:o.mids||[],iid:o.iid||'',uid:me.id,void:false};F().led.push(e);return e}
function mny(aid,amt,src,ref,note){mn({aid:aid,amt:amt,src:src,ref:ref,note:note});return db.money[db.money.length-1].id}
function incAcc(type,desc,amt,date){var x={id:uid(),no:docNo('IN'),date:date,type:type,desc:desc,amt:r2(amt),aid:'',
 ref:'',sid:null,auto:false,void:false,uid:me.id,at:atDay(date)};db.inc.push(x);return x.id}

/* ---------- ACTIONS ---------- */
function receive(pid,aid,date,parts,note){need('fleet.write');
 var per=pp(pid),sum=r2(SUM(parts,function(p){return p.amt}));
 if(sum<=0)throw new Error('ยอดรับเงินต้องมากกว่า 0');if(!aid)throw new Error('เลือกบัญชีที่รับเงิน');
 parts.forEach(function(p){if(p.b!=='DEP'&&p.amt>fb(pid,p.b)+0.005)
  throw new Error('รับ'+BN[p.b]+'เกินยอดค้าง (ค้าง '+B(fb(pid,p.b))+')')});
 var rc=docNo('FR');
 parts.forEach(function(p){var mid=mny(aid,p.amt,SRC[p.b],rc,BN[p.b]+' — '+per.name);
  ent({pid:pid,b:p.b,k:'PAY',amt:p.b==='DEP'?p.amt:-p.amt,rc:rc,mids:[mid],date:date,note:note})});
 audit('FLEET','fleet',rc,null,{pid:pid,sum:sum,parts:parts},note);save();return rc}
function billRent(){need('fleet.write');var td=DAY(),n=0,t=0;
 F().use.forEach(function(u){var up=u.to&&u.to<td?u.to:td,d=dDiff(u.billed,up);if(d<=0)return;
  var amt=d*u.rate,p=pp(u.pid);
  ent({pid:u.pid,b:'RENT',k:'CHG',amt:amt,date:up,iid:incAcc('FLEET_RENT','ค่าเช่ารถ '+cr(u.cid).plate+' — '+p.name,amt,up),
   note:cr(u.cid).plate+' · '+d+' วัน × '+B(u.rate)+' ('+u.billed+'→'+up+')'});
  u.billed=up;n++;t+=amt});
 if(n){audit('FLEET','fleet','bill',null,{n:n,t:t});save()}return {n:n,t:r2(t)}}
function repair(o){need('fleet.write');var p=pp(o.pid);
 if(o.amt<=0)throw new Error('ใส่ยอดค่าซ่อม');if(!o.desc)throw new Error('ใส่รายละเอียด');
 var dep=Math.min(o.dep||0,o.amt);if(dep>fb(o.pid,'DEP')+0.005)throw new Error('เงินค้ำไม่พอ (เหลือ '+B(fb(o.pid,'DEP'))+')');
 if(dep>0&&!o.charge)throw new Error('ต้องติ๊ก "เรียกเก็บจากพนักงาน" ก่อนหักเงินค้ำ');
 var rc=docNo('FP');
 if(o.aid)addExp({date:o.date,cat:'ซ่อมรถพนักงาน',desc:o.desc+' ('+cr(o.cid).plate+' / '+p.name+')',amt:o.amt,aid:o.aid,ref:rc});
 if(o.charge){ent({pid:o.pid,b:'REP',k:'CHG',amt:o.amt,rc:rc,date:o.date,note:o.desc+' · '+cr(o.cid).plate,
   iid:incAcc('FLEET_REP','เรียกคืนค่าซ่อม '+p.name,o.amt,o.date)});
  if(dep>0){ent({pid:o.pid,b:'DEP',k:'USE',amt:-dep,rc:rc,date:o.date,note:'หักเงินค้ำจ่ายค่าซ่อม'});
   ent({pid:o.pid,b:'REP',k:'OFFSET',amt:-dep,rc:rc,date:o.date,note:'ชำระด้วยเงินค้ำ'})}}
 audit('FLEET','fleet',rc,null,o);save();return rc}
function newLoan(o){need('fleet.write');var l=loanOf(o.pid);
 if(l&&fb(o.pid,'LOAN')>0.005)throw new Error('มีสัญญาผ่อนที่ยังไม่ปิด');
 var fin=r2(o.price-o.down+o.intr);if(fin<=0||o.months<1)throw new Error('ตรวจยอดและจำนวนงวด');
 var L={id:uid(),pid:o.pid,cid:o.cid,price:o.price,down:o.down,intr:o.intr,fin:fin,months:o.months,
  amt:Math.ceil(fin/o.months),start:o.start,depM:o.depM||0};F().loans.push(L);
 ent({pid:o.pid,b:'LOAN',k:'NEW',amt:fin,date:o.start,note:'สัญญาผ่อนรถ '+cr(o.cid).plate+' ราคา '+B(o.price)+' ดาวน์ '+B(o.down)+' ดอก '+B(o.intr)});
 var c=F().cars.filter(function(x){return x.id===o.cid})[0];if(c){c.own='SOLD';c.owner=o.pid}
 audit('FLEET','fleet',L.id,null,L);save();return L}
function closeP(pid,aid,date){need('fleet.admin');var per=pp(pid),rc=docNo('FC');
 F().use.forEach(function(u){if(u.pid===pid&&!u.to)u.to=date});billRent();
 var d=fb(pid,'DEP');['RENT','REP'].forEach(function(b){var x=Math.min(d,fb(pid,b));
  if(x>0.005){ent({pid:pid,b:'DEP',k:'USE',amt:-x,rc:rc,date:date,note:'หักชำระ'+BN[b]+'ตอนออก'});
   ent({pid:pid,b:b,k:'OFFSET',amt:-x,rc:rc,date:date,note:'ชำระด้วยเงินค้ำ'});d=r2(d-x)}});
 if(d>0.005){if(!aid)throw new Error('เลือกบัญชีที่จ่ายคืนเงินค้ำ');
  ent({pid:pid,b:'DEP',k:'REFUND',amt:-d,rc:rc,date:date,note:'คืนเงินค้ำ',
   mids:[mny(aid,-d,'คืนเงินค้ำ',rc,'คืนเงินค้ำ — '+per.name)]})}
 per.st='L';per.leftAt=date;audit('FLEET','fleet',rc,null,{pid:pid,refund:d});save();return d}
function voidE(id,rs){need('fleet.admin');if(!rs)throw new Error('ต้องระบุเหตุผล');
 var e=F().led.filter(function(x){return x.id===id})[0];if(!e||e.void)throw new Error('ยกเลิกไม่ได้');
 var g=e.rc?F().led.filter(function(x){return x.rc===e.rc&&!x.void}):[e];
 g.forEach(function(x){x.void=true});
 var bad=['DEP','RENT','REP','LOAN'].some(function(b){return fb(e.pid,b)<-0.005});
 if(bad){g.forEach(function(x){x.void=false});throw new Error('ยกเลิกแล้วยอดคงเหลือติดลบ — ยกเลิกรายการที่ผูกกันก่อน')}
 g.forEach(function(x){(x.mids||[]).forEach(function(mid){var m=db.money.filter(function(z){return z.id===mid})[0];
  if(m)mn({aid:m.aid,amt:-m.amt,src:'REVERSE',ref:x.id,note:'ยกเลิก '+x.no+': '+rs})});
  if(x.iid){var i=db.inc.filter(function(z){return z.id===x.iid})[0];if(i)i.void=true}});
 audit('FLEET','fleet',id,{no:e.no},null,rs);save()}

/* ---------- VIEWS ---------- */
function lockV(){return '<div class="card"><div class="emp">🔒 เฉพาะเจ้าของและฝ่ายบัญชี</div></div>'}
function tabs(t){return '<div class="row" style="margin-bottom:12px">'+[['P','👥 พนักงาน'],['C','🚗 รถ']].map(function(x){
 return '<button class="btn sm '+(t===x[0]?'':'o')+'" onclick="FL.tab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function vFleet(){
 if(!can('fleet.read'))return lockV();
 if(S.fp&&pp(S.fp))return vP(S.fp);
 var t=S.fs||'P',h=[],f=F(),w=can('fleet.write');
 var od=f.ppl.filter(function(p){return p.st==='A'&&overdue(p.id)}).length;
 h.push('<div class="card"><h2>🚗 เงินค้ำ · ค่าเช่ารถ · ค่างวด<span class="sp"></span>'+(w?'<button class="btn sm a" onclick="FL.bill()">⏱ คิดค่าเช่าถึงวันนี้</button>':'')+'</h2><div class="grid g4">'+
  st('เงินค้ำที่ถือไว้',B(tot('DEP')),'หนี้สิน ไม่ใช่รายได้','pu')+st('ค่าเช่าค้างรับ',B(tot('RENT')),'','am')+

  h.push('</tbody></table></div>')
 }else{

  if(!f.ppl.length)h.push('<tr><td colspan="6" class="emp">ยังไม่มีพนักงาน กด ＋ เพิ่มพนักงาน</td></tr>');
  f.ppl.slice().sort(function(a,b){return (a.st>b.st?1:a.st<b.st?-1:0)||a.name.localeCompare(b.name)}).forEach(function(p){
   var d=fb(p.id,'DEP');
   h.push('<tr onclick="FL.open(\''+p.id+'\')" style="cursor:pointer'+(p.st==='L'?';opacity:.55':'')+'"><td><b>'+E(p.name)+'</b>'+(p.st==='L'?' <span class="tg g-s">ออกแล้ว</span>':'')+
    (overdue(p.id)?' <span class="tg g-r">ค้างงวด</span>':'')+'</td><td class="num">'+B(d)+(p.target?'<div class="mu">เป้า '+B(p.target)+'</div>':'')+
    '</td><td class="num">'+B(fb(p.id,'RENT'))+'</td><td class="num">'+B(fb(p.id,'REP'))+'</td><td class="num">'+B(fb(p.id,'LOAN'))+

 return h.join('')+'</div>'}
function vP(pid){var p=pp(pid),f=F(),w=can('fleet.write'),l=loanOf(pid),h=[];
 var d=fb(pid,'DEP'),r=fb(pid,'RENT'),rp=fb(pid,'REP'),lo=fb(pid,'LOAN'),net=r2(d-r-rp);
 h.push('<div class="card"><h2><button class="btn xs o" onclick="FL.back()">← กลับ</button> '+E(p.name)+(p.st==='L'?' <span class="tg g-s">ออกแล้ว '+(p.leftAt||'')+'</span>':'')+
  '<span class="sp"></span><button class="btn xs o" onclick="FL.print(\''+pid+'\')">🖨 พิมพ์</button>'+(w?' <button class="btn xs o" onclick="FL.mP(\''+pid+'\')">แก้ไข</button>':'')+'</h2>'+
  '<div class="grid g4">'+st('💜 เงินค้ำ',B(d),p.target?'เป้า '+B(p.target):'','pu')+st('ค่าเช่าค้าง',B(r),'','am')+st('ค่าซ่อมค้าง',B(rp),'','am')+
  st('ค่างวดคงเหลือ',B(lo),l?('งวดละ '+B(l.amt)+(nextDue(pid)?' · ครบ '+nextDue(pid):'')):'ไม่มีสัญญาผ่อน',overdue(pid)?'rd':'bl')+'</div>'+
  '<p class="mu" style="margin-top:9px">เงินค้ำสุทธิหลังหักค่าเช่า/ค่าซ่อมค้าง: <b>'+B(net)+'</b>'+(net<0?' (พนักงานยังติดบริษัท)':' (คืนได้ตอนออก)')+'</p></div>');
 if(p.st==='A'&&w)h.push('<div class="card"><div class="row"><button class="btn g" onclick="FL.mR(\''+pid+'\')">💵 รับเงิน (แยกหมวด)</button>'+
  '<button class="btn o" onclick="FL.mU(\''+pid+'\')">🚗 ให้ใช้รถ</button><button class="btn o" onclick="FL.mRep(\''+pid+'\')">🔧 ค่าซ่อม/เสียหาย</button>'+
  '<button class="btn o" onclick="FL.mL(\''+pid+'\')">📄 สัญญาผ่อนรถ</button>'+(can('fleet.admin')?'<button class="btn r" onclick="FL.mX(\''+pid+'\')">🚪 ออก/คืนเงินค้ำ</button>':'')+'</div>'+
  f.use.filter(function(u){return u.pid===pid&&!u.to}).map(function(u){return '<div class="al y" onclick="FL.mEnd(\''+u.id+'\')"><div><b>🚗 '+E(cr(u.cid).plate)+' · '+B(u.rate)+'/วัน</b><span>ใช้ตั้งแต่ '+u.from+' · แตะเพื่อคืนรถ</span></div></div>'}).join('')+'</div>');
 var run={DEP:0,RENT:0,REP:0,LOAN:0};
 h.push('<div class="card"><h2>📒 ใบแจ้งยอดรายบัญชี</h2><div class="tw"><table><thead><tr><th>วันที่</th><th>หมวด</th><th>รายการ</th><th class="num">+/−</th><th class="num">คงเหลือหมวด</th><th></th></tr></thead><tbody>');
 var rows=f.led.filter(function(e){return e.pid===pid}).sort(function(a,b){return a.at.localeCompare(b.at)});
 if(!rows.length)h.push('<tr><td colspan="6" class="emp">ยังไม่มีรายการ</td></tr>');
 rows.map(function(e){if(!e.void)run[e.b]=r2(run[e.b]+e.amt);return {e:e,r:run[e.b]}}).reverse().forEach(function(x){var e=x.e;
  h.push('<tr'+(e.void?' style="opacity:.4;text-decoration:line-through"':'')+'><td class="mu">'+e.date+'</td><td><span class="tg '+BC[e.b]+'">'+BN[e.b]+'</span></td><td>'+E(e.note||e.k)+'<div class="mu">'+e.no+(e.rc?' · '+e.rc:'')+'</div></td>'+
   '<td class="num" style="font-weight:700;color:'+((e.b==='DEP')===(e.amt>0)?'var(--gr)':'var(--rd)')+'">'+(e.amt>0?'+':'')+B(e.amt)+'</td><td class="num">'+B(x.r)+'</td><td>'+
   (!e.void&&can('fleet.admin')?'<button class="btn xs o" onclick="FL.vd(\''+e.id+'\')">ยกเลิก</button>':'')+'</td></tr>')});
 return h.join('')+'</tbody></table></div></div>'}

/* ---------- MODALS ---------- */
function opts(a,f,sel){return a.map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+E(f(x))+'</option>'}).join('')}
var FL=window.FL={
 tab:function(t){S.fs=t;render()},open:function(id){S.fp=id;render()},back:function(){S.fp=null;render()},
 bill:function(){var r=billRent();toast(r.n?'คิดค่าเช่า '+r.n+' รายการ รวม '+B(r.t):'ไม่มีค่าเช่าที่ต้องคิดเพิ่ม');render()},
 mP:function(id){var p=id?pp(id):{name:'',phone:'',target:0,note:''};
  modal(id?'แก้ไขพนักงาน':'เพิ่มพนักงาน','<label>ชื่อ</label><input id="f_n" value="'+E(p.name)+'" list="f_dl"><datalist id="f_dl">'+(typeof empList==='function'?empList().map(function(n){return '<option value="'+E(n)+'">'}).join(''):'')+'</datalist>'+
   '<label>เบอร์โทร</label><input id="f_ph" value="'+E(p.phone||'')+'"><label>เป้าเงินค้ำ (บาท)</label><input id="f_t" type="number" value="'+(p.target||'')+'"><label>หมายเหตุ</label><input id="f_nt" value="'+E(p.note||'')+'">',function(){
   need('fleet.write');var n=V('f_n');if(!n)throw new Error('ใส่ชื่อ');
   if(F().ppl.some(function(x){return x.name===n&&x.id!==id}))throw new Error('ชื่อซ้ำ');
   if(id){p.name=n;p.phone=V('f_ph');p.target=N('f_t');p.note=V('f_nt')}else F().ppl.push({id:uid(),name:n,phone:V('f_ph'),target:N('f_t'),note:V('f_nt'),st:'A'});
   audit('FLEET','fleet',id||n,null,{name:n});save();shut();render()})},
 mC:function(id){var c=id?cr(id):{plate:'',name:'',year:'',rate:0};
  modal(id?'แก้ไขรถ':'เพิ่มรถ','<label>ทะเบียน</label><input id="f_pl" value="'+E(c.plate)+'"><label>รุ่น</label><input id="f_nm" value="'+E(c.name)+'">'+
   '<label>ปีรถ (ค.ศ. หรือ พ.ศ.)</label><input id="f_y" type="number" value="'+(c.year||'')+'" oninput="$(\'f_r\').value=FL.sg(this.value)"><label>ค่าเช่า/วัน (แนะนำตามอายุรถ)</label><input id="f_r" type="number" value="'+(c.rate||'')+'">',function(){
   need('fleet.write');if(!V('f_pl'))throw new Error('ใส่ทะเบียน');
   if(id){c.plate=V('f_pl');c.name=V('f_nm');c.year=N('f_y');c.rate=N('f_r')}else F().cars.push({id:uid(),plate:V('f_pl'),name:V('f_nm'),year:N('f_y'),rate:N('f_r'),own:'CO'});
   save();shut();render()})},
 sg:function(y){return suggest(y)},
 mRate:function(){var c=F().cfg;modal('เกณฑ์ค่าเช่าตามอายุรถ','<div class="grid g2"><div><label>รถใหม่ อายุไม่เกิน (ปี)</label><input id="f_a1" type="number" value="'+c.a1+'"></div><div><label>ค่าเช่า/วัน</label><input id="f_t1" type="number" value="'+c.t1+'"></div>'+
   '<div><label>รถกลาง อายุไม่เกิน (ปี)</label><input id="f_a2" type="number" value="'+c.a2+'"></div><div><label>ค่าเช่า/วัน</label><input id="f_t2" type="number" value="'+c.t2+'"></div></div><label>รถเก่า ค่าเช่า/วัน</label><input id="f_t3" type="number" value="'+c.t3+'">',function(){
   need('fleet.admin');F().cfg={a1:N('f_a1'),a2:N('f_a2'),t1:N('f_t1'),t2:N('f_t2'),t3:N('f_t3')};save();shut();render()})},
 mU:function(pid){var busy={};F().use.forEach(function(u){if(!u.to)busy[u.cid]=1});
  var fr=F().cars.filter(function(c){return !busy[c.id]&&c.own!=='SOLD'});if(!fr.length){toast('ไม่มีรถว่าง','r');return}
  modal('ให้ใช้รถ','<label>รถ</label><select id="f_c" onchange="$(\'f_ur\').value=FL.cr(this.value)">'+opts(fr,function(c){return c.plate+' '+c.name},fr[0].id)+'</select><label>เริ่มใช้วันที่</label><input id="f_d" type="date" value="'+DAY()+'"><label>ค่าเช่า/วัน</label><input id="f_ur" type="number" value="'+fr[0].rate+'">',function(){
   need('fleet.write');var d=V('f_d'),rt=N('f_ur');if(rt<=0)throw new Error('ใส่ค่าเช่า/วัน');
   F().use.push({id:uid(),pid:pid,cid:V('f_c'),from:d,to:null,rate:rt,billed:addDays(d,-1)});audit('FLEET','fleet',pid,null,{car:V('f_c')});save();shut();render()})},
 cr:function(id){return cr(id).rate},
 mEnd:function(uid2){if(!can('fleet.write'))return;modal('คืนรถ','<label>วันที่คืน (คิดค่าเช่าถึงวันนี้)</label><input id="f_d" type="date" value="'+DAY()+'">',function(){
   var u=F().use.filter(function(x){return x.id===uid2})[0];u.to=V('f_d');billRent();audit('FLEET','fleet',uid2,null,{end:u.to});save();shut();render()},'คืนรถ')},
 mR:function(pid){var l=loanOf(pid),lo=fb(pid,'LOAN'),sl=lo>0&&l?Math.min(l.amt,lo):0,sd=lo>0&&l?l.depM:0;
  var ln=function(b,v){return '<label>'+BN[b]+(b==='DEP'?'':' <span class="mu">(ค้าง '+B(fb(pid,b))+')</span>')+'</label><input id="r_'+b+'" type="number" step="0.01" value="'+(v||'')+'" oninput="FL.t()">'};
  modal('💵 รับเงินจาก '+E(pp(pid).name),'<p class="mu">กรอกแยกหมวด — ระบบลงสมุดบัญชีเงินแยกบรรทัดตามหมวด</p><div class="grid g2"><div><label>วันที่</label><input id="f_d" type="date" value="'+DAY()+'"></div><div><label>เข้าบัญชี</label><select id="f_ac">'+accOpt()+'</select></div></div>'+
   ln('LOAN',sl)+ln('DEP',sd)+ln('RENT',fb(pid,'RENT'))+ln('REP',0)+'<label>หมายเหตุ</label><input id="f_nt"><div class="st c-gr" style="margin-top:12px"><div class="l">ยอดรับรวม</div><div class="v" id="r_tot">0.00</div></div>',function(){
   var parts=['LOAN','DEP','RENT','REP'].map(function(b){return {b:b,amt:N('r_'+b)}}).filter(function(x){return x.amt>0});
   var rc=receive(pid,V('f_ac'),V('f_d'),parts,V('f_nt'));shut();toast('บันทึกใบรับเงิน '+rc);render()},'บันทึกรับเงิน');FL.t()},
 t:function(){var s=0;['LOAN','DEP','RENT','REP'].forEach(function(b){s+=N('r_'+b)});if($('r_tot'))$('r_tot').textContent=B(s)},
 mRep:function(pid){var cs=F().cars;modal('🔧 ค่าซ่อม/ความเสียหาย','<label>รถ</label><select id="f_c">'+opts(cs,function(c){return c.plate+' '+c.name})+'</select><label>วันที่</label><input id="f_d" type="date" value="'+DAY()+'">'+
   '<label>รายละเอียด</label><input id="f_ds"><label>ยอดค่าซ่อม</label><input id="f_a" type="number" step="0.01"><label>บริษัทจ่ายอู่จากบัญชี (ถ้าจ่ายแล้วผ่านระบบ)</label><select id="f_ac"><option value="">— ไม่บันทึกรายจ่าย —</option>'+accOpt()+'</select>'+
   '<label><input type="checkbox" id="f_ch" checked style="width:auto"> เรียกเก็บจากพนักงาน</label><label>หักจากเงินค้ำ (มี '+B(fb(pid,'DEP'))+')</label><input id="f_dp" type="number" step="0.01">',function(){
   var rc=repair({pid:pid,cid:V('f_c'),date:V('f_d'),desc:V('f_ds'),amt:N('f_a'),aid:V('f_ac'),charge:$('f_ch').checked,dep:N('f_dp')});shut();toast('บันทึก '+rc);render()})},
 mL:function(pid){var cs=F().cars.filter(function(c){return c.own!=='SOLD'});if(!cs.length){toast('เพิ่มรถก่อน','r');return}
  modal('📄 สัญญาผ่อนรถ','<label>รถ</label><select id="f_c">'+opts(cs,function(c){return c.plate+' '+c.name})+'</select><div class="grid g2"><div><label>ราคารถ</label><input id="f_p" type="number"></div><div><label>เงินดาวน์</label><input id="f_dw" type="number" value="0"></div>'+
   '<div><label>ดอกเบี้ยรวม</label><input id="f_i" type="number" value="0"></div><div><label>จำนวนงวด</label><input id="f_m" type="number"></div><div><label>งวดแรกวันที่</label><input id="f_d" type="date" value="'+addM(DAY(),1)+'"></div><div><label>เก็บเข้าเงินค้ำ/งวด</label><input id="f_dm" type="number" value="0"></div></div>',function(){
   var L=newLoan({pid:pid,cid:V('f_c'),price:N('f_p'),down:N('f_dw'),intr:N('f_i'),months:N('f_m'),start:V('f_d'),depM:N('f_dm')});shut();toast('สร้างสัญญา งวดละ '+B(L.amt));render()})},
 mX:function(pid){var n=r2(fb(pid,'DEP')-fb(pid,'RENT')-fb(pid,'REP')),lo=fb(pid,'LOAN');
  modal('🚪 พนักงานออก / คืนเงินค้ำ','<p>เงินค้ำ <b>'+B(fb(pid,'DEP'))+'</b> − ค่าเช่า/ค่าซ่อมค้าง = คืนสุทธิ <b>'+B(Math.max(n,0))+'</b></p>'+(lo>0?'<p style="color:var(--rd)">⚠ ยังมีค่างวดรถค้าง '+B(lo)+' (ไม่ถูกหักจากเงินค้ำ)</p>':'')+
   '<label>วันที่ออก</label><input id="f_d" type="date" value="'+DAY()+'"><label>จ่ายคืนจากบัญชี</label><select id="f_ac">'+accOpt()+'</select>',function(){
   var d=closeP(pid,V('f_ac'),V('f_d'));shut();toast('ปิดบัญชีแล้ว คืนเงิน '+B(d));render()},'ยืนยันปิดบัญชี')},
 vd:function(id){modal('ยกเลิกรายการ','<p class="mu">ยกเลิกทั้งใบ (รวมรายการที่ผูกกัน) และกลับรายการเงินในสมุดบัญชี</p><label>เหตุผล</label><input id="f_rs">',function(){voidE(id,V('f_rs'));shut();render()},'ยกเลิก')},
 print:function(pid){var p=pp(pid),w=window.open('','_blank');if(!w)return;
  var r=F().led.filter(function(e){return e.pid===pid&&!e.void}).sort(function(a,b){return a.at.localeCompare(b.at)}).map(function(e){return '<tr><td>'+e.date+'</td><td>'+BN[e.b]+'</td><td>'+E(e.note||e.k)+'</td><td align=right>'+B(e.amt)+'</td></tr>'}).join('');
  w.document.write('<meta charset="utf-8"><title>ใบแจ้งยอด</title><body style="font-family:Sarabun,Tahoma,sans-serif"><h2>ใบแจ้งยอด — '+E(p.name)+'</h2><p>ออกเมื่อ '+DAY()+'</p><p>เงินค้ำ '+B(fb(pid,'DEP'))+' | ค่าเช่าค้าง '+B(fb(pid,'RENT'))+' | ค่าซ่อมค้าง '+B(fb(pid,'REP'))+' | ค่างวดคงเหลือ '+B(fb(pid,'LOAN'))+
   '</p><table border=1 cellpadding=5 style="border-collapse:collapse;width:100%"><tr><th>วันที่</th><th>หมวด</th><th>รายการ</th><th>จำนวน</th></tr>'+r+'</table><script>print()<\/script>');w.document.close()}
};

/* ---------- REGISTER ---------- */
var oldIC=window.integrityCheck;
if(typeof oldIC==='function')window.integrityCheck=integrityCheck=function(){var is=oldIC.apply(this,arguments);
 F().ppl.forEach(function(p){['DEP','RENT','REP','LOAN'].forEach(function(b){var v=fb(p.id,b);
  if(v<-0.005)is.push({type:'FLEET',severity:'CRITICAL',item:p.name+' — '+BN[b],expected:0,actual:v,diff:v,msg:'ยอดคงเหลือติดลบ'})})});return is};
PAGES.push(['fleet','🚗 เงินค้ำ-รถ']);VIEWS.fleet=vFleet;
NAVGROUPS.forEach(function(g){if(g[0]==='g_fin'&&g[2].indexOf('fleet')<0)g[2].push('fleet')});
try{migrate()}catch(e){}
console.log('%c✅ v9.0 เงินค้ำ/ค่าเช่ารถ/ค่างวด loaded','color:#7c3aed;font-weight:bold');
})();
