<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 OR — ศูนย์กระจายสินค้า</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--cd:#fff;--ln:#e2e8f0;--tx:#0f172a;--mu:#64748b;
--pr:#2563eb;--gr:#059669;--rd:#dc2626;--am:#d97706;--pu:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Sarabun,Tahoma,sans-serif;
background:var(--bg);color:var(--tx);font-size:15px;line-height:1.55;padding-bottom:88px}
.hide{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
header{background:#0f172a;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hb{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:9px}
.hb h1{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:800;cursor:pointer;white-space:nowrap}
.who{font-size:12px;background:rgba(255,255,255,.14);padding:5px 11px;border-radius:99px;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 9px;max-width:1200px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{background:rgba(255,255,255,.08);color:#cbd5e1;border:0;padding:9px 14px;border-radius:99px;
font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit}
nav button.on{background:#fff;color:#0f172a}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.st{border-radius:13px;padding:14px}
.st .l{font-size:12px;opacity:.75;font-weight:600}
.st .v{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.st .s{font-size:11.5px;opacity:.65;margin-top:2px}
.c-bl{background:#eff6ff;color:#1e3a8a}.c-gr{background:#ecfdf5;color:#065f46}
.c-rd{background:#fef2f2;color:#991b1b}.c-am{background:#fffbeb;color:#92400e}
.c-sl{background:#f8fafc;color:#1e293b}.c-pu{background:#f5f3ff;color:#5b21b6}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:11px 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:11px;
font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px #2563eb22}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
select:disabled{background:#f1f5f9;color:#94a3b8}
.btn{padding:13px 18px;border:0;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;
font-family:inherit;background:var(--pr);color:#fff;display:inline-flex;align-items:center;
justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.a{background:var(--am)}
.btn.p{background:var(--pu)}
.btn.o{background:#fff;color:var(--tx);border:1.5px solid var(--ln)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
th{background:#f8fafc;padding:11px 10px;text-align:left;font-size:12px;color:var(--mu);
font-weight:700;white-space:nowrap;border-bottom:1px solid var(--ln)}
td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tg{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:700}
.g-g{background:#d1fae5;color:#065f46}.g-r{background:#fee2e2;color:#991b1b}
.g-a{background:#fef3c7;color:#92400e}.g-b{background:#dbeafe;color:#1e40af}
.g-s{background:#f1f5f9;color:#475569}.g-p{background:#ede9fe;color:#5b21b6}
.mu{color:var(--mu);font-size:12px}
.emp{padding:34px;text-align:center;color:var(--mu);font-size:14px}
.al{display:flex;gap:11px;padding:13px 14px;border-radius:12px;margin-bottom:9px;
border-left:5px solid;cursor:pointer;align-items:flex-start}
.al.r{background:#fef2f2;border-color:var(--rd)}
.al.y{background:#fffbeb;border-color:var(--am)}
.al.k{background:#ecfdf5;border-color:var(--gr);cursor:default}
.al b{display:block;font-size:14.5px}.al span{font-size:12.5px;color:var(--mu)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background:linear-gradient(160deg,#0f172a,#1e3a8a)}
.lb{background:#fff;border-radius:20px;padding:26px;max-width:430px;width:100%;max-height:94vh;overflow:auto}
.ub{display:flex;align-items:center;gap:13px;width:100%;padding:13px;border:1.5px solid var(--ln);
border-radius:13px;background:#fff;margin-bottom:9px;cursor:pointer;text-align:left;font-family:inherit}
.ub:hover{border-color:var(--pr);background:#f8fafc}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
#mod{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:flex;
align-items:flex-end;justify-content:center}
.mb{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:580px;
max-height:92vh;overflow-y:auto}
@media(min-width:640px){#mod{align-items:center;padding:20px}.mb{border-radius:18px}}
#tst{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:200;
padding:13px 20px;border-radius:12px;color:#fff;font-weight:600;font-size:14px;max-width:88vw;
box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.fab{position:fixed;right:16px;bottom:18px;z-index:60;box-shadow:0 8px 22px rgba(37,99,235,.45);
border-radius:99px;padding:15px 24px;font-size:16px}
.ln{display:flex;gap:8px;align-items:center;padding:10px;background:#f8fafc;border-radius:11px;margin-bottom:8px}
.ln .x{flex:1;font-size:13.5px;min-width:0}
hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.sec{font-size:12px;font-weight:800;color:var(--mu);letter-spacing:.5px;margin:16px 0 8px}
.chart{display:flex;align-items:flex-end;gap:5px;padding:6px 0 0}
.cd{flex:1;display:flex;flex-direction:column;align-items:center}
.cbs{display:flex;align-items:flex-end;gap:3px;height:126px;width:100%;justify-content:center;
border-bottom:2px solid var(--ln)}
.cb{width:38%;max-width:22px;border-radius:5px 5px 0 0;min-height:3px}
.cb1{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.cb2{background:linear-gradient(180deg,#fca5a5,#dc2626)}
.cv{font-size:10px;color:var(--mu);font-weight:700;height:14px}
.cl{font-size:10.5px;color:var(--mu);text-align:center;margin-top:3px;line-height:1.2}
.cd.nw{background:#f8fafc;border-radius:9px}
.cd.nw .cl{color:var(--pr);font-weight:800}
.lg{display:flex;gap:14px;justify-content:center;margin-top:9px;font-size:12px;color:var(--mu)}
.dt{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.qr{max-width:200px;border:1px solid var(--ln);border-radius:12px;display:block;margin:10px auto}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;
background:#f1f5f9;color:#475569;margin:0 4px 4px 0;cursor:pointer;border:1px solid var(--ln)}
.pill.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#eb{position:fixed;top:0;left:0;right:0;z-index:999;background:#dc2626;color:#fff;
padding:10px 14px;font-size:13px;display:none}
pre{font-size:11px;overflow:auto;background:#f8fafc;padding:10px;border-radius:9px;margin-top:8px;
white-space:pre-wrap;word-break:break-all}
.emg{position:fixed;bottom:72px;right:16px;z-index:60}
.emg-btn{background:#dc2626;color:#fff;border:0;padding:12px 18px;border-radius:11px;
font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(220,38,38,.4);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.dev-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;
background:#f1f5f9;color:#64748b;margin-left:6px;font-weight:600}
.integrity-box{background:#fef2f2;border:2px solid #dc2626;border-radius:12px;padding:16px;margin:16px 0}
.integrity-ok{background:#ecfdf5;border-color:#059669}
.sync-badge{position:fixed;top:8px;right:8px;z-index:150;font-size:11px;padding:4px 10px;
border-radius:99px;font-weight:700;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sync-on{background:#059669;color:#fff}.sync-off{background:#dc2626;color:#fff}
.sync-wait{background:#d97706;color:#fff}
.expL{background:#fee2e2}.expM{background:#fef3c7}
.star{color:#f59e0b;letter-spacing:-1px}
.blk{background:#fef2f2;border:2px solid #dc2626;border-radius:10px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div id="eb"></div>
<div id="syncBadge" class="sync-badge"></div>
<div id="login"></div>
<div id="app" class="hide">
<header>
 <div class="hb"><h1>📦 2 OR · ศูนย์กระจายสินค้า</h1>
 <span class="bdg" id="bdg" onclick="go('test')"></span>
 <span class="who" id="who"></span></div>
 <nav id="nav"></nav>
</header>
<div class="wrap" id="page"></div>
<button class="btn fab" id="fab" onclick="go('sale')">＋ ลงขาย</button>
<div class="emg" id="emgBtn"></div>
</div>

<script>
/* ═════ GUARD ═════ */
window.onerror=function(m,s,l){var b=document.getElementById('eb');
 b.style.display='block';b.textContent='⚠️ '+m+' (บรรทัด '+l+')';return false};

/* ═════ STORAGE ═════ */
var KEY='tdl3_stock';var MEM={};
var ST={g:function(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}},
 s:function(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}},
 d:function(k){try{localStorage.removeItem(k)}catch(e){delete MEM[k]}}};
var SES={g:function(k){try{return sessionStorage.getItem(k)}catch(e){return MEM['s'+k]||null}},
 s:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){MEM['s'+k]=v}}};

/* ═════ FIREBASE ═════ */
var firebaseConfig={
  apiKey:"AIzaSyAMLv-pkK1Lf36a9yvoFLAmdctVg1-Isk0",
  authDomain:"or-demo-88f03.firebaseapp.com",
  projectId:"or-demo-88f03",
  storageBucket:"or-demo-88f03.firebasestorage.app",
  messagingSenderId:"300673689539",
  appId:"1:300673689539:web:96637a6e51f589c4b67f76"
};
var fdb=null,FIREBASE_ENABLED=false;
try{
 if(firebaseConfig.apiKey&&firebaseConfig.apiKey.indexOf('ใส่ตรงนี้')<0&&typeof firebase!=='undefined'){
  firebase.initializeApp(firebaseConfig);fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  FIREBASE_ENABLED=true}
}catch(e){FIREBASE_ENABLED=false}
var COMPANY_ID='2or-main';
var cloudUnsub=null,cloudFirstSync=false,isRemoteUpdate=false,cloudSaveTimer=null,pendingRemoteDoc=null;
function syncBadge(state){
 var b=document.getElementById('syncBadge');if(!b)return;
 if(!FIREBASE_ENABLED){b.style.display='none';return}
 b.style.display='block';
 if(state==='on'){b.className='sync-badge sync-on';b.textContent='☁️ ออนไลน์';
  setTimeout(function(){b.style.display='none'},2000)}
 else if(state==='wait'){b.className='sync-badge sync-wait';b.textContent='☁️ กำลังเชื่อมต่อ...'}
 else{b.className='sync-badge sync-off';b.textContent='⚠️ ออฟไลน์ (บันทึกในเครื่อง)'}}
function cloudSave(){
 if(!FIREBASE_ENABLED||isRemoteUpdate||!db)return;
 clearTimeout(cloudSaveTimer);
 cloudSaveTimer=setTimeout(function(){
  fdb.collection('company').doc(COMPANY_ID).set({
   data:JSON.stringify(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
   updatedBy:me?me.name:'unknown',deviceId:getDeviceId(),deviceName:getDeviceName()
  }).then(function(){syncBadge('on')}).catch(function(){syncBadge('off')})},600)}
/* ★ FIX: การซิงค์ข้อมูลจาก Cloud ต้อง "รอ" จนกว่า modal ที่เปิดอยู่จะถูกปิดก่อน
   มิฉะนั้น object ที่ modal อ้างอิงไว้ (เช่น บัญชี/ผู้ใช้ที่กำลังแก้ไข) จะกลายเป็นของ
   ที่หลุดจาก db จริง ทำให้กดบันทึกแล้วข้อมูลหาย/สลับบัญชีเพี้ยน — นี่คือสาเหตุของปัญหา
   "เมนูตั้งค่า/สลับบัญชีพัง" ที่รายงานมา */
function applyRemoteSnapshot(doc){
 if(!doc.exists){cloudSave();cloudFirstSync=true;syncBadge('on');return}
 var remote=null;
 try{remote=JSON.parse(doc.data().data)}catch(e){return}
 if(!remote||!remote.products||!remote.users)return;
 if(JSON.stringify(remote)===JSON.stringify(db)){cloudFirstSync=true;syncBadge('on');return}
 isRemoteUpdate=true;db=remote;migrate();ST.s(KEY,JSON.stringify(db));
 if(cloudFirstSync){try{
   if(me){var u=null,i;
    for(i=0;i<db.users.length;i++)if(db.users[i].id===me.id)u=db.users[i];
    if(u)me=u}
   toast('🔄 ข้อมูลอัปเดตจากอุปกรณ์อื่น');render()}catch(e){}}
 cloudFirstSync=true;syncBadge('on');isRemoteUpdate=false}
function startCloudSync(){
 if(!FIREBASE_ENABLED)return;
 syncBadge('wait');
 if(cloudUnsub)cloudUnsub();
 cloudUnsub=fdb.collection('company').doc(COMPANY_ID).onSnapshot(function(doc){
  if($('mod')){pendingRemoteDoc=doc;return}
  applyRemoteSnapshot(doc);
 },function(){syncBadge('off')})}
function stopCloudSync(){if(cloudUnsub){cloudUnsub();cloudUnsub=null}}

/* ═════ DEVICE ═════ */
function getDeviceId(){var did=ST.g('deviceId');
 if(!did){did='DEV-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);ST.s('deviceId',did)}
 return did}
function getDeviceName(){var n=ST.g('deviceName');return n||'อุปกรณ์ไม่มีชื่อ'}
function setDeviceName(n){ST.s('deviceName',n)}
function getDeviceInfo(){return {id:getDeviceId(),name:getDeviceName(),browser:navigator.userAgent,
 screen:screen.width+'x'+screen.height,lastUsed:new Date().toISOString()}}

/* ═════ EMERGENCY ═════ */
var EMGMODE=false;
function hashPW(s){
 var h=5381,i;for(i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h=h&h}
 var h2=52711;for(i=0;i<s.length;i++){h2=((h2<<5)+h2)^s.charCodeAt(i);h2=h2&h2}
 return (h>>>0).toString(16)+(h2>>>0).toString(16)}
function getEmgHash(){return ST.g('emgHash')}
function setEmgHash(pw){ST.s('emgHash',hashPW(pw))}
function checkEmgPW(pw){return !!getEmgHash()&&getEmgHash()===hashPW(pw)}
function checkEmergency(){var e=$('emgBtn');if(!e)return;
 if(me&&me.role==='OWNER'){
  e.innerHTML='<button class="emg-btn" onclick="activateEmergency()">🚨 ฉุกเฉิน</button>';
  e.style.display='block'}else{e.style.display='none'}}
function setupEmgPassword(next){
 modal('🚨 ตั้งรหัสผ่านฉุกเฉิน (ครั้งแรก)',
  '<div style="background:#fef2f2;padding:12px;border-radius:8px;margin-bottom:16px">'+
  '<p style="color:#dc2626;font-weight:700">⚠️ ยังไม่เคยตั้งรหัสผ่านฉุกเฉิน</p>'+
  '<p class="mu">เก็บเฉพาะในเครื่องนี้แบบเข้ารหัส ไม่มีวิธีกู้คืนถ้าลืม</p></div>'+
  '<label>ตั้งรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input type="password" id="emgset1">'+
  '<label>ยืนยันรหัสผ่าน</label><input type="password" id="emgset2">',
  function(){var p1=V('emgset1'),p2=V('emgset2');
   if(p1.length<6)throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
   if(p1!==p2)throw new Error('รหัสผ่านไม่ตรงกัน');
   setEmgHash(p1);shut();toast('ตั้งรหัสผ่านฉุกเฉินเรียบร้อย');if(next)next()},'✅ ตั้งรหัสผ่าน')}
function changeEmgPassword(){
 var hasOld=!!getEmgHash();
 modal(hasOld?'🔑 เปลี่ยนรหัสผ่านฉุกเฉิน':'🚨 ตั้งรหัสผ่านฉุกเฉิน',
  (hasOld?'<label>รหัสผ่านเดิม</label><input type="password" id="emgold">':'')+
  '<label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label><input type="password" id="emgnew1">'+
  '<label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="emgnew2">',
  function(){
   if(hasOld&&!checkEmgPW(V('emgold')))throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
   var p1=V('emgnew1'),p2=V('emgnew2');
   if(p1.length<6)throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
   if(p1!==p2)throw new Error('รหัสผ่านไม่ตรงกัน');
   setEmgHash(p1);shut();toast('เปลี่ยนรหัสผ่านเรียบร้อย')},'💾 บันทึก')}
function activateEmergency(){
 if(!getEmgHash()){setupEmgPassword(activateEmergency);return}
 modal('🚨 โหมดฉุกเฉิน',
  '<div style="background:#fef2f2;padding:12px;border-radius:8px;margin-bottom:16px">'+
  '<p style="color:#dc2626;font-weight:700;margin-bottom:8px">⚠️ ข้ามการตรวจสอบสิทธิ์ชั่วคราว</p>'+
  '<p class="mu">• บันทึกในประวัติทั้งหมด • ปิดอัตโนมัติใน 5 นาที</p></div>'+
  '<label>รหัสผ่านฉุกเฉิน</label><input type="password" id="emgpw">'+
  '<label>เหตุผล (บังคับ อย่างน้อย 10 ตัวอักษร)</label><textarea id="emgrs"></textarea>',
  function(){
   var pw=V('emgpw'),rs=V('emgrs');
   if(!checkEmgPW(pw))throw new Error('รหัสผ่านไม่ถูกต้อง');
   if(!rs||rs.length<10)throw new Error('ต้องระบุเหตุผลอย่างน้อย 10 ตัวอักษร');
   EMGMODE=true;var dev=getDeviceInfo();
   audit('EMERGENCY_ACTIVATE','system','EMG',null,{reason:rs,device:dev.id,deviceName:dev.name},rs);
   save();shut();toast('⚠️ เปิดโหมดฉุกเฉิน: '+rs,'a');
   setTimeout(function(){if(EMGMODE){EMGMODE=false;toast('⏰ โหมดฉุกเฉินปิดอัตโนมัติ','a');
     audit('EMERGENCY_AUTO_CLOSE','system','EMG',{active:true},{active:false},'Auto timeout');save()}},300000);
   render()},'🚨 เปิดโหมดฉุกเฉิน')}

/* ═════ CORE ═════ */
var db=null,me=null,TESTING=false,TESTS=[];
var S={page:'dash',sub:null,draft:null,filter:''};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function r2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function r3(n){return Math.round((Number(n)+Number.EPSILON)*1000)/1000}
function B(n){return new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)}
function Q(n){return new Intl.NumberFormat('th-TH',{maximumFractionDigits:3}).format(Number(n)||0)}
function DAY(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(d?new Date(d):new Date())}
function DT(d){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',
 month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function WD(d){return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',weekday:'short'}).format(new Date(d+'T12:00:00+07:00'))}
function ISO(d,t){return new Date(d+'T'+t+':00.000+07:00').toISOString()}
function NOW(){return new Date().toISOString()}
function atDay(d){return d===DAY()?NOW():ISO(d,'12:00')}
function addDays(d,n){var x=new Date(d+'T12:00:00+07:00');x.setDate(x.getDate()+n);return DAY(x)}
function dDiff(a,b){return Math.round((new Date(b+'T12:00:00+07:00')-new Date(a+'T12:00:00+07:00'))/86400000)}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
function V(i){var e=$(i);return e?String(e.value).trim():''}
function N(i){return parseFloat(V(i))||0}
function SUM(a,f){var s=0,i;for(i=0;i<a.length;i++)s+=f?f(a[i]):a[i];return s}
function kf(n){n=Number(n)||0;if(!n)return '';
 if(Math.abs(n)>=1000000)return (n/1000000).toFixed(1)+'M';
 if(Math.abs(n)>=1000)return (n/1000).toFixed(1)+'K';return String(Math.round(n))}
function stars(n){var s='',i;for(i=0;i<(n||0);i++)s+='★';for(i=(n||0);i<5;i++)s+='☆';return s}
function save(){if(TESTING)return;ST.s(KEY,JSON.stringify(db));cloudSave();pendingRemoteDoc=null}
function load(){try{var s=ST.g(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function toast(m,k){var o=$('tst');if(o)o.remove();
 var e=document.createElement('div');e.id='tst';e.textContent=m;
 e.style.background={g:'#059669',r:'#dc2626',a:'#d97706'}[k||'g'];
 document.body.appendChild(e);setTimeout(function(){e.remove()},3400)}
function shut(){var m=$('mod');if(m)m.remove();
 if(pendingRemoteDoc){var d=pendingRemoteDoc;pendingRemoteDoc=null;applyRemoteSnapshot(d)}}
function modal(t,h,ok,lb){shut();
 var d=document.createElement('div');d.id='mod';
 d.innerHTML='<div class="mb"><h2 style="font-size:18px;margin-bottom:8px">'+t+'</h2><div>'+h+
  '</div><div class="row" style="margin-top:18px"><button class="btn o" style="flex:1" onclick="shut()">ปิด</button>'+
  (ok?'<button class="btn" style="flex:2" id="mok">'+(lb||'บันทึก')+'</button>':'')+'</div></div>';
 d.onclick=function(e){if(e.target===d)shut()};
 document.body.appendChild(d);
 if(ok)$('mok').onclick=function(){try{ok()}catch(x){toast(x.message||String(x),'r')}}}

/* ═════ MIGRATE ═════ */
function migrate(){
 if(!db)return;
 if(!db.lots)db.lots=[];
 if(!db.comms)db.comms=[];
 if(!db.compays)db.compays=[];
 if(!db.customers)db.customers=[];
 if(!db.ar)db.ar=[];
 if(!db.arpays)db.arpays=[];
 if(!db.deposits)db.deposits=[];
 if(!db.cfg)db.cfg={expWarn:7};
 if(db.cfg.expWarn===undefined)db.cfg.expWarn=7;
 if(db.cfg.dueWarn===undefined)db.cfg.dueWarn=3;
 if(!db.exCats)db.exCats=[];
 if(db.exCats.indexOf('ค่าคอมมิชชั่น/โบนัส')<0)db.exCats.push('ค่าคอมมิชชั่น/โบนัส');
 (db.products||[]).forEach(function(p){
  if(p.comType===undefined)p.comType='FIXED';
  if(p.comVal===undefined)p.comVal=0;
  if(p.bonType===undefined)p.bonType='PCT';
  if(p.bonVal===undefined)p.bonVal=0;
  if(p.packName===undefined)p.packName='ลัง';
  if(p.packQty===undefined)p.packQty=12});
 (db.customers||[]).forEach(function(c){
  if(c.grade===undefined)c.grade=3;
  if(c.creditDays===undefined)c.creditDays=0;
  if(c.creditLimit===undefined)c.creditLimit=0;
  if(c.black===undefined)c.black=false;
  if(c.active===undefined)c.active=true});
 (db.sales||[]).forEach(function(s){if(s.cid===undefined)s.cid=null})}

/* ═════ ROLES ═════ */
var PERM={'product.write':['OWNER','ACCOUNTING'],'stock.in':['OWNER','ACCOUNTING','WAREHOUSE'],
'stock.count':['OWNER','ACCOUNTING','WAREHOUSE'],'stock.approve':['OWNER'],
'sale.write':['OWNER','ACCOUNTING'],'sale.void':['OWNER'],'money.write':['OWNER','ACCOUNTING'],
'recon.write':['OWNER','ACCOUNTING'],'audit.read':['OWNER','ACCOUNTING'],
'comm.read':['OWNER','ACCOUNTING'],'comm.pay':['OWNER'],
'cust.read':['OWNER','ACCOUNTING','WAREHOUSE'],'cust.write':['OWNER','ACCOUNTING'],
'cust.black':['OWNER'],'ar.read':['OWNER','ACCOUNTING'],'ar.pay':['OWNER','ACCOUNTING'],
'admin':['OWNER']};
function can(p){if(EMGMODE)return true;return (PERM[p]||[]).indexOf(me.role)>=0}
function need(p){if(!can(p))throw new Error('ไม่มีสิทธิ์ทำรายการนี้ (บทบาท: '+RTH[me.role]+')')}
var RTH={OWNER:'เจ้าของ',ACCOUNTING:'บัญชี',WAREHOUSE:'คลังสินค้า',VIEWER:'ผู้ชม'};
var RCL={OWNER:'#7c3aed',ACCOUNTING:'#2563eb',WAREHOUSE:'#d97706',VIEWER:'#64748b'};

/* ═════ LOOKUP ═════ */
function P(id){for(var i=0;i<db.products.length;i++)if(db.products[i].id===id)return db.products[i];
 return {id:id,sku:'-',name:'(ไม่พบสินค้า)',unit:'',cost:0,price:0,cat:'-',brand:'-',active:false,
  comType:'FIXED',comVal:0,bonType:'PCT',bonVal:0,packName:'ลัง',packQty:12}}
function AC(id){if(!id)return {id:'',name:'—',type:'CASH',opening:0,qr:''};
 for(var i=0;i<db.accounts.length;i++)if(db.accounts[i].id===id)return db.accounts[i];
 return {id:id,name:'(ไม่พบบัญชี)',type:'CASH',opening:0,qr:''}}
function US(id){for(var i=0;i<db.users.length;i++)if(db.users[i].id===id)return db.users[i];
 return {id:id,name:'(ผู้ใช้ถูกลบ)',role:'VIEWER'}}
function CU(id){if(!id)return {id:'',code:'',name:'ลูกค้าทั่วไป',phone:'',addr:'',grade:3,
  creditDays:0,creditLimit:0,black:false,blackRs:'',note:'',active:true};
 for(var i=0;i<db.customers.length;i++)if(db.customers[i].id===id)return db.customers[i];
 return {id:id,code:'',name:'(ร้านถูกลบ)',phone:'',addr:'',grade:0,creditDays:0,creditLimit:0,
  black:false,blackRs:'',note:'',active:false}}
function smap(){var m={},i;
 for(i=0;i<db.products.length;i++)m[db.products[i].id]=0;
 for(i=0;i<db.moves.length;i++){var v=db.moves[i];m[v.pid]=r3((m[v.pid]||0)+v.qty)}return m}
function onh(pid){var s=0,i;for(i=0;i<db.moves.length;i++)if(db.moves[i].pid===pid)s+=db.moves[i].qty;return r3(s)}
function bal(aid,before){var a=AC(aid),s=a.opening,i;
 for(i=0;i<db.money.length;i++){var t=db.money[i];
  if(t.aid===aid&&(!before||t.at<=before))s+=t.amt}return r2(s)}
function balT(ty,before){var s=0,i;
 for(i=0;i<db.accounts.length;i++)if(db.accounts[i].type===ty)s+=bal(db.accounts[i].id,before);return r2(s)}
function salesOn(d){return db.sales.filter(function(s){return s.status==='POSTED'&&DAY(s.at)===d})}
function salesYM(ym){return db.sales.filter(function(s){return s.status==='POSTED'&&DAY(s.at).slice(0,7)===ym})}

/* ═════ LOT / FEFO ═════ */
function lotsOf(pid){return db.lots.filter(function(l){return l.pid===pid&&l.rem>0.0001})
 .sort(function(a,b){
  if(!a.exp&&!b.exp)return a.at.localeCompare(b.at);
  if(!a.exp)return 1;if(!b.exp)return -1;return a.exp.localeCompare(b.exp)})}
function lotQty(pid){return r3(SUM(db.lots.filter(function(l){return l.pid===pid}),function(l){return l.rem}))}
function allocFEFO(pid,qty){
 var ls=lotsOf(pid),nd=r3(qty),out=[],i;
 for(i=0;i<ls.length&&nd>0.0001;i++){
  var take=Math.min(ls[i].rem,nd);
  ls[i].rem=r3(ls[i].rem-take);nd=r3(nd-take);out.push({lid:ls[i].id,qty:r3(take)})}
 return out}
function releaseFEFO(allocs){(allocs||[]).forEach(function(a){
 for(var i=0;i<db.lots.length;i++)if(db.lots[i].id===a.lid)db.lots[i].rem=r3(db.lots[i].rem+a.qty)})}
function lotName(lid){for(var i=0;i<db.lots.length;i++)if(db.lots[i].id===lid)
 return db.lots[i].lot+(db.lots[i].exp?'/EXP'+db.lots[i].exp:'');return ''}
function nearExp(days){
 var td=DAY(),lim=addDays(td,days===undefined?(db.cfg.expWarn||7):days);
 return db.lots.filter(function(l){return l.rem>0.0001&&l.exp&&l.exp<=lim})
  .sort(function(a,b){return a.exp.localeCompare(b.exp)})}

/* ═════ COMMISSION ═════ */
function calcCom(p,qty,tot){
 var com=p.comType==='PCT'?r2(tot*(p.comVal||0)/100):r2(qty*(p.comVal||0));
 var bon=p.bonType==='PCT'?r2(tot*(p.bonVal||0)/100):r2(qty*(p.bonVal||0));
 return {com:com,bon:bon,sum:r2(com+bon)}}
function commOf(emp){return db.comms.filter(function(c){return c.emp===emp&&!c.void})}
function commDue(emp){return r2(SUM(commOf(emp).filter(function(c){return !c.paid}),function(c){return c.sum}))}
function empList(){var m={},i;
 for(i=0;i<db.comms.length;i++)if(!db.comms[i].void)m[db.comms[i].emp]=1;
 for(i=0;i<db.sales.length;i++)if(db.sales[i].emp)m[db.sales[i].emp]=1;
 return Object.keys(m).sort()}

/* ═════ CUSTOMER / AR / DEPOSIT ═════ */
function arOf(cid){return db.ar.filter(function(a){return a.cid===cid&&a.status!=='VOID'})}
function arRem(a){return r2(a.amt-a.paid)}
function custOut(cid){return r2(SUM(arOf(cid).filter(function(a){return a.status==='OPEN'}),arRem))}
function arOpen(){return db.ar.filter(function(a){return a.status==='OPEN'})
 .sort(function(a,b){return a.due.localeCompare(b.due)})}
function arOverdue(){var td=DAY();return arOpen().filter(function(a){return a.due<td})}
function depBal(cid){return r2(SUM(db.deposits.filter(function(d){return d.cid===cid&&!d.void}),
 function(d){return r2(d.amt-d.used)}))}
function useDeposit(cid,amt){
 var ds=db.deposits.filter(function(d){return d.cid===cid&&!d.void&&r2(d.amt-d.used)>0.004})
  .sort(function(a,b){return a.at.localeCompare(b.at)});
 var nd=r2(amt),i;
 for(i=0;i<ds.length&&nd>0.004;i++){
  var av=r2(ds[i].amt-ds[i].used),take=Math.min(av,nd);
  ds[i].used=r2(ds[i].used+take);nd=r2(nd-take)}
 if(nd>0.004)throw new Error('เงินมัดจำไม่พอ');return true}
function restoreDeposit(cid,amt){
 var ds=db.deposits.filter(function(d){return d.cid===cid&&!d.void&&d.used>0.004})
  .sort(function(a,b){return b.at.localeCompare(a.at)});
 var nd=r2(amt),i;
 for(i=0;i<ds.length&&nd>0.004;i++){
  var take=Math.min(ds[i].used,nd);ds[i].used=r2(ds[i].used-take);nd=r2(nd-take)}}
function addDeposit(cid,amt,aid,note){
 need('money.write');
 if(!cid)throw new Error('ต้องระบุร้านค้า');
 if(amt<=0)throw new Error('จำนวนเงินต้องมากกว่า 0');
 var at=NOW(),no=docNo('DP');
 var d={id:uid(),no:no,cid:cid,at:at,date:DAY(at),amt:r2(amt),used:0,aid:aid,
  note:note||'',void:false,uid:me.id};
 db.deposits.push(d);
 mn({aid:aid,amt:amt,src:'DEPOSIT',ref:d.id,note:'รับเงินมัดจำ '+CU(cid).name,at:at});
 audit('ADD_DEPOSIT','deposits',d.id,null,{no:no,cust:CU(cid).name,amt:r2(amt)},note);
 save();return d}
function findAR(id){for(var i=0;i<db.ar.length;i++)if(db.ar[i].id===id)return db.ar[i];
 throw new Error('ไม่พบรายการลูกหนี้')}
function payAR(arid,amt,aid,note){
 need('ar.pay');
 var a=findAR(arid);
 if(a.status==='VOID')throw new Error('รายการนี้ถูกยกเลิกแล้ว');
 if(a.status==='PAID')throw new Error('รายการนี้ชำระครบแล้ว');
 if(amt<=0)throw new Error('จำนวนเงินต้องมากกว่า 0');
 var rem=arRem(a);
 if(amt>rem+0.005)throw new Error('เกินยอดค้างชำระ — ค้างอยู่ '+B(rem));
 if(!aid)throw new Error('กรุณาเลือกบัญชีที่รับเงิน');
 var at=NOW();
 var p={id:uid(),arid:arid,cid:a.cid,at:at,amt:r2(amt),aid:aid,note:note||'',uid:me.id,void:false};
 db.arpays.push(p);
 a.paid=r2(a.paid+amt);
 if(a.paid>=r2(a.amt-0.005))a.status='PAID';
 mn({aid:aid,amt:amt,src:'AR',ref:p.id,note:'รับชำระหนี้ '+a.no+' — '+CU(a.cid).name,at:at});
 audit('PAY_AR','ar',a.id,{paid:r2(a.paid-amt)},{paid:a.paid,status:a.status},note);
 save();return p}
function aging(){
 var td=DAY(),g={cur:0,d7:0,d15:0,d30:0,d30p:0,n:0};
 arOpen().forEach(function(a){
  var rem=arRem(a),ov=dDiff(a.due,td);g.n++;
  if(ov<=0)g.cur=r2(g.cur+rem);
  else if(ov<=7)g.d7=r2(g.d7+rem);
  else if(ov<=15)g.d15=r2(g.d15+rem);
  else if(ov<=30)g.d30=r2(g.d30+rem);
  else g.d30p=r2(g.d30p+rem)});
 g.tot=r2(g.cur+g.d7+g.d15+g.d30+g.d30p);return g}

/* ═════ WRITE ═════ */
function audit(act,ent,eid,ov,nv,rs){var dev=getDeviceInfo();db.audit.unshift({id:uid(),at:NOW(),uid:me.id,
 uname:me.name+' ('+RTH[me.role]+')',act:act,ent:ent,eid:eid,
 old:ov?JSON.stringify(ov):null,nw:nv?JSON.stringify(nv):null,rs:rs||null,
 deviceId:dev.id,deviceName:dev.name,emergency:EMGMODE})}
function docNo(p,at){var k=p+DAY(at||new Date()).replace(/-/g,'');
 db.ctr[k]=(db.ctr[k]||0)+1;return p+'-'+DAY(at||new Date()).replace(/-/g,'')+'-'+String(db.ctr[k]).padStart(4,'0')}
function mv(o){
 if((o.type==='ADJUST'||o.type==='WASTE')&&!(o.rs||'').trim())throw new Error('ต้องระบุเหตุผล');
 if(!o.qty)throw new Error('จำนวนต้องไม่เป็นศูนย์');
 var m={id:uid(),at:o.at||NOW(),pid:o.pid,type:o.type,qty:r3(o.qty),cost:r2(o.cost||0),
  ref:o.ref||'',rs:o.rs||null,uid:me.id,lot:o.lot||null};db.moves.push(m);return m}
function mn(o){db.money.push({id:uid(),at:o.at||NOW(),aid:o.aid,amt:r2(o.amt),src:o.src,
 ref:o.ref||'',note:o.note||'',uid:me.id})}

/* ═════ SALE ═════ */
function postSale(d){
 need('sale.write');
 if(!d.items.length)throw new Error('ต้องมีสินค้าอย่างน้อย 1 รายการ');
 if(!d.pays.length)throw new Error('ต้องระบุการรับเงินอย่างน้อย 1 รายการ');
 if(d.chan==='EMP'&&!(d.emp||'').trim())throw new Error('ต้องระบุชื่อ/รหัสพนักงาน');
 var cust=d.cid?CU(d.cid):null;
 if(cust&&cust.black&&!EMGMODE)
  throw new Error('⛔ ร้าน "'+cust.name+'" อยู่ใน Blacklist — '+(cust.blackRs||'ห้ามขาย'));
 var sm=smap(),req={},i;
 for(i=0;i<d.items.length;i++){var t=d.items[i];
  if(t.qty<=0)throw new Error('จำนวนต้องมากกว่า 0');
  req[t.pid]=r3((req[t.pid]||0)+t.qty)}
 for(var k in req)if((sm[k]||0)<req[k]-1e-9)
  throw new Error('สต็อก "'+P(k).name+'" ไม่พอ — เหลือ '+Q(sm[k]||0)+' ต้องการ '+Q(req[k]));
 var L=d.items.map(function(x){var p=P(x.pid);
  return {pid:x.pid,qty:r3(x.qty),price:r2(x.price),cost:r2(p.cost),
   tot:r2(x.qty*x.price),cogs:r2(x.qty*p.cost)}});
 var tot=r2(SUM(L,function(l){return l.tot})),cogs=r2(SUM(L,function(l){return l.cogs}));
 var paid=r2(SUM(d.pays,function(p){return p.amt}));
 if(Math.abs(tot-paid)>0.005)
  throw new Error('รับเงิน '+B(paid)+' ไม่ตรงยอดขาย '+B(tot)+' (ต่าง '+B(paid-tot)+')');
 var credAmt=r2(SUM(d.pays.filter(function(p){return p.m==='CREDIT'}),function(p){return p.amt}));
 var depAmt=r2(SUM(d.pays.filter(function(p){return p.m==='DEPOSIT'}),function(p){return p.amt}));
 if(credAmt>0){
  if(!cust)throw new Error('ขายเชื่อต้องระบุร้านค้า');
  if(cust.creditLimit>0){
   var out=custOut(d.cid);
   if(r2(out+credAmt)>r2(cust.creditLimit+0.005))
    throw new Error('เกินวงเงินเครดิต — ค้างอยู่ '+B(out)+' + ใหม่ '+B(credAmt)+
     ' = '+B(out+credAmt)+' > วงเงิน '+B(cust.creditLimit))}}
 if(depAmt>0){
  if(!cust)throw new Error('ใช้เงินมัดจำต้องระบุร้านค้า');
  if(depBal(d.cid)<r2(depAmt-0.005))
   throw new Error('เงินมัดจำไม่พอ — เหลือ '+B(depBal(d.cid))+' ต้องการ '+B(depAmt))}
 for(i=0;i<d.pays.length;i++){var pm=d.pays[i],a=AC(pm.aid);
  if(pm.amt<=0)throw new Error('จำนวนเงินต้องมากกว่า 0');
  if(pm.m==='CREDIT'||pm.m==='DEPOSIT')continue;
  if(!pm.aid)throw new Error('ต้องเลือกบัญชีรับเงิน');
  if(pm.m==='CASH'&&a.type!=='CASH')throw new Error('เงินสดต้องเข้าบัญชีเงินสด');
  if((pm.m==='TRANSFER'||pm.m==='QR')&&a.type!=='BANK')throw new Error('เงินโอน/QR ต้องเข้าบัญชีธนาคาร')}
 var at=NOW(),no=docNo('SA');
 var s={id:uid(),no:no,at:at,chan:d.chan,emp:d.emp||null,cid:d.cid||null,items:L,tot:tot,cogs:cogs,
  paid:paid,status:'POSTED',note:d.note||'',uid:me.id,com:0,bon:0,comTot:0,credit:credAmt};
 L.forEach(function(l){
  l.alloc=allocFEFO(l.pid,l.qty);
  var lotTxt=l.alloc.length?l.alloc.map(function(a2){return lotName(a2.lid)}).join(','):'';
  mv({pid:l.pid,type:'SALE',qty:-l.qty,cost:l.cost,ref:no,at:at,lot:lotTxt})});
 if(d.chan==='EMP'){
  var tc=0,tb=0;
  L.forEach(function(l){
   var p=P(l.pid),c=calcCom(p,l.qty,l.tot);
   if(c.sum===0)return;
   tc=r2(tc+c.com);tb=r2(tb+c.bon);
   db.comms.push({id:uid(),at:at,sid:s.id,no:no,emp:d.emp,pid:l.pid,pname:p.name,
    qty:l.qty,tot:l.tot,com:c.com,bon:c.bon,sum:c.sum,paid:false,payId:null,void:false})});
  s.com=tc;s.bon=tb;s.comTot=r2(tc+tb)}
 db.sales.push(s);

function recv(pid,qty,cost,ref,note,lot,exp){
 need('stock.in');
 if(qty<=0)throw new Error('จำนวนต้องมากกว่า 0');
 if(cost<0)throw new Error('ต้นทุนไม่ถูกต้อง');
 if(exp&&!/^\d{4}-\d{2}-\d{2}$/.test(exp))throw new Error('รูปแบบวันหมดอายุไม่ถูกต้อง');
 if(exp&&exp<DAY())throw new Error('วันหมดอายุย้อนหลัง — ตรวจสอบอีกครั้ง');
 var p=null,i;for(i=0;i<db.products.length;i++)if(db.products[i].id===pid)p=db.products[i];
 if(!p)throw new Error('ไม่พบสินค้า');
 var no=docNo('RC'),cur=onh(pid),oc=p.cost,nq=r3(cur+qty);
 var nc=nq<=0?r2(cost):r2((cur*oc+qty*cost)/nq);
 var lt={id:uid(),pid:pid,lot:lot||no,exp:exp||null,qty:r3(qty),rem:r3(qty),
  cost:r2(cost),at:NOW(),ref:no,uid:me.id};
 db.lots.push(lt);
 mv({pid:pid,type:'RECV',qty:qty,cost:cost,ref:no,rs:note||null,lot:lt.lot+(exp?'/EXP'+exp:'')});
 if(Math.abs(nc-oc)>0.005){p.cost=nc;
  audit('UPDATE_COST','products',pid,{cost:oc},{cost:nc},'รับเข้า '+no)}
 audit('RECV_STOCK','moves',no,null,{sku:p.sku,qty:qty,cost:cost,ref:ref||'',lot:lt.lot,exp:exp||'-'},note);
 save();return no}

/* ═════ P&L ═════ */
function pnl(from,to){
 var ss=db.sales.filter(function(s){return s.status==='POSTED'&&DAY(s.at)>=from&&DAY(s.at)<=to});
 var rev=r2(SUM(ss,function(s){return s.tot}));
 var cogs=r2(SUM(ss,function(s){return s.cogs}));
 var comAcc=r2(SUM(db.comms.filter(function(c){return !c.void&&DAY(c.at)>=from&&DAY(c.at)<=to}),
  function(c){return c.sum}));
 var ws=db.moves.filter(function(m){return m.type==='WASTE'&&DAY(m.at)>=from&&DAY(m.at)<=to});
 var wsV=r2(SUM(ws,function(m){return Math.abs(m.qty)*m.cost}));
 var ex=db.exp.filter(function(e){return e.date>=from&&e.date<=to&&e.cat!=='ค่าคอมมิชชั่น/โบนัส'});
 var exV=r2(SUM(ex,function(e){return e.amt}));
 var oi=r2(SUM(db.inc.filter(function(x){return !x.void&&!x.auto&&x.date>=from&&x.date<=to}),
  function(x){return x.amt}));
 var gross=r2(rev-cogs);
 var net=r2(gross-comAcc-wsV-exV+oi);
 return {rev:rev,cogs:cogs,gross:gross,com:comAcc,waste:wsV,exp:exV,oi:oi,net:net,
  bills:ss.length,mg:rev?r2(gross/rev*100):0,nm:rev?r2(net/rev*100):0,exList:ex}}

/* ═════ INTEGRITY ═════ */
function integrityCheck(){
 var issues=[],i,p,a;
 for(i=0;i<db.products.length;i++){
  p=db.products[i];
  var calc=r3(SUM(db.moves.filter(function(m){return m.pid===p.id}),function(m){return m.qty}));
  var sys=onh(p.id);
  if(Math.abs(calc-sys)>0.001)
   issues.push({type:'STOCK',severity:'HIGH',item:p.name,expected:calc,actual:sys,diff:r3(calc-sys)});
  var lq=db.lots.filter(function(l){return l.pid===p.id});
  if(lq.length){var lrem=r3(SUM(lq,function(l){return l.rem}));
   if(Math.abs(lrem-sys)>0.001)
    issues.push({type:'LOT_MISMATCH',severity:'HIGH',item:p.name,expected:sys,actual:lrem,
     diff:r3(lrem-sys),msg:'ยอดล็อตไม่ตรงกับสต็อกระบบ'})}}
 for(i=0;i<db.accounts.length;i++){
  a=db.accounts[i];
  var calc2=r2(a.opening+SUM(db.money.filter(function(m){return m.aid===a.id}),function(m){return m.amt}));
  var sys2=bal(a.id);
  if(Math.abs(calc2-sys2)>0.01)
   issues.push({type:'BALANCE',severity:'CRITICAL',item:a.name,expected:calc2,actual:sys2,diff:r2(calc2-sys2)})}
 var skus={};
 for(i=0;i<db.products.length;i++){
  if(skus[db.products[i].sku])
   issues.push({type:'DUPLICATE',severity:'MEDIUM',item:'SKU: '+db.products[i].sku,msg:'มี SKU ซ้ำกัน'});
  skus[db.products[i].sku]=1}
 db.sales.filter(function(s){return s.status==='POSTED'}).forEach(function(s){
  if(!db.pays.filter(function(p2){return p2.sid===s.id}).length)
   issues.push({type:'MISSING_PAYMENT',severity:'CRITICAL',item:'บิล '+s.no,msg:'ไม่มีรายการรับเงิน'})});
 db.compays.forEach(function(cp){
  var sum=r2(SUM(db.comms.filter(function(c){return c.payId===cp.id}),function(c){return c.sum}));
  if(Math.abs(sum-cp.amt)>0.01)
   issues.push({type:'COMMISSION',severity:'CRITICAL',item:'ใบจ่ายคอม '+cp.no,
    expected:sum,actual:cp.amt,diff:r2(cp.amt-sum),msg:'ยอดจ่ายไม่ตรงกับรายการคอม'})});
 db.ar.filter(function(x){return x.status!=='VOID'}).forEach(function(x){
  var ps=r2(SUM(db.arpays.filter(function(p2){return p2.arid===x.id&&!p2.void}),function(p2){return p2.amt}));
  if(Math.abs(ps-x.paid)>0.01)
   issues.push({type:'AR_PAYMENT',severity:'CRITICAL',item:'ลูกหนี้ '+x.no,
    expected:ps,actual:x.paid,diff:r2(x.paid-ps),msg:'ยอดชำระไม่ตรงกับรายการรับเงิน'});

function repairDatabase(){
 shut();
 modal('🔧 ซ่อมแซมฐานข้อมูล',
  '<div style="background:#fffbeb;padding:12px;border-radius:8px;margin-bottom:16px">'+
  '<p style="font-weight:700;color:#92400e;margin-bottom:8px">⚠️ กระบวนการซ่อมแซม</p>'+
  '<p class="mu">• คำนวณสต็อก/ล็อต/ยอดเงิน/ยอดลูกหนี้ ใหม่จากประวัติ</p></div>'+
  '<label>ยืนยันรหัสผ่านฉุกเฉิน</label><input type="password" id="rppw">'+
  '<label>เหตุผลในการซ่อมแซม</label><textarea id="rprs"></textarea>',
  function(){
   if(!checkEmgPW(V('rppw')))throw new Error('รหัสผ่านไม่ถูกต้อง');
   var rs=V('rprs');if(!rs)throw new Error('ต้องระบุเหตุผล');
   var t0=Date.now(),fixed=0;
   db.products.forEach(function(p){
    var correct=r3(SUM(db.moves.filter(function(m){return m.pid===p.id}),function(m){return m.qty}));
    var lq=db.lots.filter(function(l){return l.pid===p.id});
    if(lq.length){var lrem=r3(SUM(lq,function(l){return l.rem}));
     if(Math.abs(lrem-correct)>0.001){var d=r3(correct-lrem);
      if(d>0)db.lots.push({id:uid(),pid:p.id,lot:'REPAIR',exp:null,qty:d,rem:d,cost:p.cost,
       at:NOW(),ref:'REPAIR',uid:me.id});
      else allocFEFO(p.id,-d);
      audit('REPAIR_LOT','products',p.id,{lot:lrem},{lot:correct},rs);fixed++}}});
   db.ar.filter(function(x){return x.status!=='VOID'}).forEach(function(x){
    var ps=r2(SUM(db.arpays.filter(function(p2){return p2.arid===x.id&&!p2.void}),function(p2){return p2.amt}));
    if(Math.abs(ps-x.paid)>0.01){
     audit('REPAIR_AR','ar',x.id,{paid:x.paid},{paid:ps},rs);
     x.paid=ps;x.status=(ps>=r2(x.amt-0.005))?'PAID':'OPEN';fixed++}});
   db.accounts.forEach(function(a){
    var correct=r2(a.opening+SUM(db.money.filter(function(m){return m.aid===a.id}),function(m){return m.amt}));
    var current=bal(a.id);
    if(Math.abs(correct-current)>0.01){
     audit('REPAIR_BALANCE','accounts',a.id,{bal:current},{bal:correct},rs);fixed++}});
   save();shut();toast('✅ ซ่อมแซม '+fixed+' รายการใน '+(Date.now()-t0)+'ms');
   setTimeout(function(){showIntegrityReport()},500)},'🔧 เริ่มซ่อมแซม')}

function saveCust(id){
 need('cust.write');
 var o={code:V('ck'),name:V('cn'),phone:V('cp'),addr:V('ca'),
  creditDays:Math.max(0,Math.round(N('ccd'))||0),creditLimit:r2(N('ccl')),
  grade:parseInt(V('cg'),10)||3,active:V('cac')==='1',note:V('cno')};
 if(!o.name)throw new Error('กรุณากรอกชื่อร้าน');
 if(o.creditLimit<0)throw new Error('วงเงินเครดิตต้องไม่ติดลบ');
 if(o.creditDays>365)throw new Error('เครดิตเทอมเกิน 365 วัน — ตรวจสอบอีกครั้ง');
 var i;
 if(o.code)for(i=0;i<db.customers.length;i++)
  if(db.customers[i].code===o.code&&db.customers[i].id!==id)
   throw new Error('รหัสร้าน "'+o.code+'" มีอยู่แล้ว');
 if($('cbk')){o.black=V('cbk')==='1';o.blackRs=V('cbr');
  if(o.black&&!o.blackRs)throw new Error('ต้องระบุเหตุผลที่ขึ้น Blacklist')}
 if(id){var c=null;for(i=0;i<db.customers.length;i++)if(db.customers[i].id===id)c=db.customers[i];
  var old={name:c.name,grade:c.grade,creditLimit:c.creditLimit,black:c.black};
  if(o.black===undefined){o.black=c.black;o.blackRs=c.blackRs}
  for(var k in o)c[k]=o[k];
  audit('UPDATE_CUSTOMER','customers',id,old,{name:c.name,grade:c.grade,
   creditLimit:c.creditLimit,black:c.black},o.black&&!old.black?('Blacklist: '+o.blackRs):null)}
 else{var nc={id:uid()};if(o.black===undefined){o.black=false;o.blackRs=''}
  for(k in o)nc[k]=o[k];db.customers.push(nc);
  audit('CREATE_CUSTOMER','customers',nc.id,null,{name:nc.name,grade:nc.grade,
   creditDays:nc.creditDays,creditLimit:nc.creditLimit})}
 save();shut();toast('บันทึกร้านค้าเรียบร้อย');render()}
function delCust(id){

  throw new Error('ลบไม่ได้ — ร้านนี้มีประวัติการซื้อแล้ว (ให้ปิดใช้งานแทน)');
 if(custOut(id)>0)throw new Error('ลบไม่ได้ — ร้านนี้ยังมีหนี้ค้างชำระ');
 var c=CU(id);
 db.customers=db.customers.filter(function(x){return x.id!==id});
 audit('DELETE_CUSTOMER','customers',id,{name:c.name},null,'ลบโดยผู้ใช้');
 save();shut();toast('ลบร้านค้าแล้ว');render()}

function gpBox(){if(!$('gp'))return;
 var c=N('fo'),s=N('fp'),g=r2(s-c),m=s?r2(g/s*100):0;

 var net=r2(g-com-bon);
 $('gp').innerHTML='<div class="grid g2">'+st('กำไรต่อหน่วย',B(g),'',g<0?'rd':'gr')+
  st('Gross Margin',m+'%','',m<0?'rd':'bl')+
  st('ค่าคอม+โบนัส/หน่วย',B(com+bon),'','pu')+
  st('กำไรสุทธิ/หน่วย',B(net),net<0?'⚠ ขาดทุน':'หลังหักคอม',net<0?'rd':'gr')+'</div>'}
function saveProd(id){
 need('product.write');
 var o={sku:V('fk'),brand:V('fb')||'ไม่ระบุ',name:V('fn'),cat:V('fc'),unit:V('fu')||'ชิ้น',
  cost:r2(N('fo')),price:r2(N('fp')),low:r3(N('fl')),active:V('fa')==='1',
  packName:V('fpn')||'ลัง',packQty:Math.max(1,Math.round(N('fpq'))||1),
  comType:V('fct'),comVal:r2(N('fcv')),bonType:V('fbt'),bonVal:r2(N('fbv'))};
 if(!o.sku||!o.name)throw new Error('กรุณากรอก SKU และชื่อสินค้า');
 if(o.comVal<0||o.bonVal<0)throw new Error('ค่าคอม/โบนัสต้องไม่ติดลบ');
 if(o.comType==='PCT'&&o.comVal>100)throw new Error('ค่าคอมเป็น % ต้องไม่เกิน 100');
 if(o.bonType==='PCT'&&o.bonVal>100)throw new Error('โบนัสเป็น % ต้องไม่เกิน 100');
 var i;for(i=0;i<db.products.length;i++)
  if(db.products[i].sku===o.sku&&db.products[i].id!==id)throw new Error('SKU "'+o.sku+'" มีอยู่แล้ว');
 if(id){var p=null;for(i=0;i<db.products.length;i++)if(db.products[i].id===id)p=db.products[i];
  var old={cost:p.cost,price:p.price,active:p.active,comVal:p.comVal,bonVal:p.bonVal};
  for(var k in o)p[k]=o[k];
  audit('UPDATE_PRODUCT','products',id,old,{cost:p.cost,price:p.price,active:p.active,
   comVal:p.comVal,bonVal:p.bonVal})}
 else{var np={id:uid()};for(k in o)np[k]=o[k];db.products.push(np);
  audit('CREATE_PRODUCT','products',np.id,null,o);
  var s0=r3(N('fs'));
  if(s0>0){mv({pid:np.id,type:'OPEN',qty:s0,cost:o.cost,ref:'INIT',lot:'INIT'});
   db.lots.push({id:uid(),pid:np.id,lot:'INIT',exp:null,qty:s0,rem:s0,cost:o.cost,
    at:NOW(),ref:'INIT',uid:me.id})}}
 save();shut();toast('บันทึกสินค้าเรียบร้อย');render()}

 var p=P(id);

 db.lots=db.lots.filter(function(l){return l.pid!==id});
 audit('DELETE_PRODUCT','products',id,{sku:p.sku,name:p.name},null,'ลบโดยผู้ใช้');

  function dd(m){return DAY(m.at)===d}
  var o=g(function(m){return DAY(m.at)<d}),
   rc=g(function(m){return dd(m)&&(m.type==='RECV'||m.type==='OPEN')}),
   sl=-g(function(m){return dd(m)&&m.type==='SALE'}),
   rt=g(function(m){return dd(m)&&m.type==='RETURN'}),
   ws=-g(function(m){return dd(m)&&m.type==='WASTE'}),
   aj=g(function(m){return dd(m)&&m.type==='ADJUST'}),
   cls=g(function(m){return DAY(m.at)<=d});
  if(!o&&!cls&&!rc&&!sl&&!ws&&!aj&&!rt)return;

 if(db.money.some(function(m){return m.aid===id}))throw new Error('ลบไม่ได้ — บัญชีนี้มีรายการเงินแล้ว');
 var a=AC(id);
 db.accounts=db.accounts.filter(function(x){return x.id!==id});
 audit('DELETE_ACCOUNT','accounts',id,{name:a.name},null,'ลบโดยผู้ดูแล');
 save();shut();toast('ลบบัญชีแล้ว');render()}
function addCat(key,inp){
 need('admin');var v=V(inp);
 if(!v)return;if(db[key].indexOf(v)>=0){toast('มีหมวดนี้แล้ว','a');return}
 db[key].push(v);save();toast('เพิ่มหมวดแล้ว');render()}
function delCat(key,i){
 need('admin');
 if(db[key].length<=1){toast('ต้องมีอย่างน้อย 1 หมวด','r');return}
 db[key].splice(i,1);save();render()}

function promptUserPassword(id,onOk,okLabel){
 var u=US(id);
 if(!u.pwh){
  modal('🔑 ตั้งรหัสผ่านผู้ใช้ครั้งแรก',
   '<p class="mu" style="margin-bottom:10px">บัญชี <b>'+E(u.name)+'</b> ยังไม่มีรหัสผ่าน</p>'+
   '<label>ตั้งรหัสผ่าน (อย่างน้อย 4 ตัวอักษร)</label><input type="password" id="npw1">'+
   '<label>ยืนยันรหัสผ่าน</label><input type="password" id="npw2">',
   function(){
    var p1=V('npw1'),p2=V('npw2');
    if(p1.length<4)throw new Error('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร');
    if(p1!==p2)throw new Error('รหัสผ่านไม่ตรงกัน');
    u.pwh=hashPW(p1);save();shut();onOk()},'✅ ตั้งรหัสผ่านและเข้าใช้งาน');
  return}
 modal('🔒 ยืนยันรหัสผ่าน — '+E(u.name),
  '<label>รหัสผ่าน</label><input type="password" id="upwv">',
  function(){if(hashPW(V('upwv'))!==u.pwh)throw new Error('รหัสผ่านไม่ถูกต้อง');
   shut();onOk()},okLabel||'🔓 ยืนยัน')}

function runTests(){
 var bk=JSON.stringify(db),bm=me,res=[];TESTING=true;
 function sb(role){db=JSON.parse(bk);migrate();
  var u=db.users.filter(function(x){return x.role===(role||'OWNER')})[0];
  me=u||db.users[0]}
 function ok(c,m){if(!c)throw new Error(m||'เงื่อนไขไม่เป็นจริง')}
 function bad(fn,m){var t=false;try{fn()}catch(e){t=true}if(!t)throw new Error(m||'ควรปฏิเสธแต่กลับยอมรับ')}
 function T(n,fn){try{fn();res.push({n:n,ok:true})}catch(e){res.push({n:n,ok:false,m:e.message||String(e)})}}
 function pf(sku){var r=db.products.filter(function(p){return p.sku===sku})[0];ok(r,'ไม่พบ '+sku);return r}
 function ai(t){var a=db.accounts.filter(function(x){return x.type===t})[0];ok(a,'ไม่พบบัญชี '+t);return a.id}
 function mkCust(o){var c={id:uid(),code:o.code||'',name:o.name,phone:'',addr:'',grade:o.grade||3,
  creditDays:o.creditDays||0,creditLimit:o.creditLimit||0,black:!!o.black,blackRs:o.blackRs||'',
  note:'',active:true};db.customers.push(c);return c}
 try{
 T('1. จัดรูปแบบเงินและวันที่',function(){sb();
  ok(B(1234.5)==='1,234.50','เงินผิด: '+B(1234.5));
  ok(/^\d{4}-\d{2}-\d{2}$/.test(DAY()),'วันที่ผิดรูปแบบ')});
 T('2. ปัดเศษทศนิยม',function(){sb();
  ok(r2(10.005)===10.01&&r3(1.0005)===1.001,'ปัดเศษผิด')});
 T('3. สต็อกเท่ากับผลรวมสมุดบัญชี',function(){sb();
  var p=db.products[0],m=SUM(db.moves.filter(function(x){return x.pid===p.id}),function(x){return x.qty});
  ok(r3(m)===onh(p.id),'ยอดไม่ตรง')});
 T('4. ข้อมูลสินค้าครบทุกแบรนด์',function(){sb();
  ok(db.products.length>=40,'สินค้าน้อยเกินไป');
  ['เต็งหนึ่ง','สลิลทิพย์','เมจิ'].forEach(function(b){
   ok(db.products.some(function(p){return p.brand===b}),'ไม่พบแบรนด์ '+b)})});
 T('5. ขาย → ตัดสต็อก + เงินเข้า + รายรับอัตโนมัติ',function(){sb();
  var p=pf('TN-SY-001'),a=ai('CASH');
  recv(p.id,20,p.cost,'PO-T5','เตรียม',null,addDays(DAY(),120));
  var b4=onh(p.id),c4=bal(a);

   pays:[{m:'CASH',amt:r2(3*p.price),aid:a}]});

  ok(bal(a)===r2(c4+3*p.price),'เงินไม่เข้า');
  ok(db.inc.filter(function(x){return x.sid===s.id}).length===1,'ไม่สร้างรายรับ')});
 T('6. ขายเกินสต็อก ต้องบล็อก',function(){sb();
  var p=pf('TN-SY-001'),a=ai('CASH');
  bad(function(){postSale({chan:'COMPANY',items:[{pid:p.id,qty:999999,price:1}],
   pays:[{m:'CASH',amt:999999,aid:a}]})})});
 T('7. เงินรับไม่ตรงยอด ต้องบล็อก',function(){sb();

 T('9. ขายผ่านพนักงานต้องระบุชื่อ',function(){sb();

   if(t.t==='id'){
    pos++;
    if(peek()&&peek().v==='('){
     pos++;var args=[];if(!peek()||peek().v!==')'){while(true){var a=exprn();
       if(peek()&&peek().v===':'){pos++;var end=take().v;var st=t.v.toUpperCase();a={range:rangeRefs(st,end)}}
       args.push(a);if(!peek()||peek().v!==',')break;pos++}}
     take(')');return fn(t.v,args)
    }
    var cp=cellParts(t.v);if(cp){
     if(peek()&&peek().v===':'){pos++;var end=take().v;return {range:rangeRefs(cp.ref,end)}}
     return value(cp.ref)
    }
    if(t.v.toUpperCase()==='TRUE')return 1;if(t.v.toUpperCase()==='FALSE')return 0;
    throw new Error('ไม่พบชื่อ '+t.v)
   }
   throw new Error('สูตรผิดใกล้ '+t.v)
  }
  function value(ref){
   ref=String(ref).toUpperCase();stack=stack||[];
   if(stack.indexOf(ref)>=0)throw new Error('สูตรวนกลับที่ '+ref);
   var raw=cells[ref];if(raw==null||raw==='')return 0;
   if(String(raw).charAt(0)==='=')return evalFormula(raw,cells,stack.concat(ref));
   return isNaN(Number(String(raw).replace(/,/g,'')))?String(raw):Number(String(raw).replace(/,/g,''))
  }
  function fn(name,args){
   var n=name.toUpperCase(),a=flat(args,value);
   if(n==='SUM')return a.reduce(function(s,x){return s+numeric(x)},0);
   if(n==='AVERAGE')return a.length?a.reduce(function(s,x){return s+numeric(x)},0)/a.length:0;
   if(n==='MIN')return a.length?Math.min.apply(null,a.map(numeric)):0;
   if(n==='MAX')return a.length?Math.max.apply(null,a.map(numeric)):0;
   if(n==='COUNT')return a.filter(function(x){return !isNaN(Number(x))}).length;
   if(n==='ABS')return Math.abs(numeric(args[0]));
   if(n==='ROUND')return Number(numeric(args[0]).toFixed(numeric(args[1]===undefined?0:args[1])));
   if(n==='IF')return numeric(args[0])?args[1]||0:args[2]||0;
   throw new Error('ยังไม่รองรับฟังก์ชัน '+name)
  }
  var result=exprn();if(pos<ts.length)throw new Error('สูตรมีส่วนเกิน '+ts[pos].v);return result
 }
 function cellResult(ref,cells){
  var raw=cells[ref];if(raw==null||raw==='')return '';
  if(String(raw).charAt(0)!=='=')return raw;
  try{var v=evalFormula(raw,cells,[ref]);return typeof v==='number'?(Math.round(v*100000)/100000):v}
  catch(e){return '#ERR: '+e.message}
 }
 NX.evalFormula=evalFormula;

       }, 300);

<script>
/* ═══════════════════════════════════════════════════════════════════
   v5.4 — พาร์ทเนอร์ / ร้านใหญ่ + ระบบฝากขาย (เฟส 1)
   ส่งของฝาก → ตัดยอดขายได้ (เกิดรายได้+ลูกหนี้) → คืนของ
   ═══════════════════════════════════════════════════════════════════ */
(function(){
 'use strict';
 if(typeof db==='undefined'||typeof PAGES==='undefined'||typeof VIEWS==='undefined'||typeof allocFEFO!=='function'){
  console.warn('v5.4 ข้าม: ไม่พบโครงสร้างระบบ');return}
 PERM['cons.read']=['OWNER','ACCOUNTING','WAREHOUSE'];
 PERM['cons.write']=['OWNER','ACCOUNTING'];
 MT.CONSIGN=['ฝากขาย','g-a'];MT.CONS_RET=['รับคืนฝาก','g-g'];
 var KIND={PARTNER:'พาร์ทเนอร์ต่างจังหวัด',KEY:'ร้านใหญ่'},DK={OUT:['ส่งฝาก','g-a'],SOLD:['ตัดยอดขาย','g-b'],RET:['คืนของ','g-g']};
 var CT={k:'',id:'',lines:[]};
 function ini(){if(!db.partners)db.partners=[];if(!db.consB)db.consB=[];if(!db.cons)db.cons=[]}
 function PT(id){ini();for(var i=0;i<db.partners.length;i++)if(db.partners[i].id===id)return db.partners[i];return null}
 function bsOf(id,pid){return db.consB.filter(function(b){return b.pt===id&&b.rem>0.0001&&(!pid||b.pid===pid)})
  .sort(function(a,b){return a.at.localeCompare(b.at)})}
 function heldQty(id,pid){return r3(SUM(bsOf(id,pid),function(b){return b.rem}))}
 window.heldQty=heldQty;
 function heldPids(id){var m={};bsOf(id).forEach(function(b){m[b.pid]=1});return Object.keys(m)}
 function chkHeld(id,lines){var req={};
  lines.forEach(function(l){if(!(l.qty>0))throw new Error('จำนวนต้องมากกว่า 0');req[l.pid]=r3((req[l.pid]||0)+l.qty)});
  for(var k in req)if(heldQty(id,k)<req[k]-1e-9)
   throw new Error('ของฝาก "'+P(k).name+'" ไม่พอ — เหลือ '+Q(heldQty(id,k))+' ต้องการ '+Q(req[k]))}
 function take(id,pid,q){var bs=bsOf(id,pid),nd=r3(q),out=[],i,j;
  for(i=0;i<bs.length&&nd>0.0001;i++){var b=bs[i],t=Math.min(b.rem,nd),x=t,al=[];
   b.rem=r3(b.rem-t);nd=r3(nd-t);
   for(j=0;j<b.alloc.length&&x>0.0001;j++){var a=b.alloc[j],y=Math.min(a.qty,x);
    a.qty=r3(a.qty-y);x=r3(x-y);if(y>0)al.push({lid:a.lid,qty:r3(y)})}
   out.push({qty:r3(t),price:b.price,cost:b.cost,alloc:al})}
  return out}
 function doc(k,id,no,at,lines,tot,note){db.cons.push({id:uid(),no:no,at:at,k:k,pt:id,tot:r2(tot),n:lines.length,note:note||'',uid:me.id})}

 window.consOut=function(id,lines,note){ini();need('cons.write');var pt=PT(id);
  if(!pt)throw new Error('ไม่พบพาร์ทเนอร์');if(!lines.length)throw new Error('ยังไม่มีรายการสินค้า');
  var req={};lines.forEach(function(l){if(!(l.qty>0))throw new Error('จำนวนต้องมากกว่า 0');
   if(!(l.price>=0))throw new Error('ราคาไม่ถูกต้อง');req[l.pid]=r3((req[l.pid]||0)+l.qty)});
  for(var k in req)if(onh(k)<req[k]-1e-9)throw new Error('สต็อก "'+P(k).name+'" ไม่พอ — เหลือ '+Q(onh(k)));
  var at=NOW(),no=docNo('CO'),tot=0;
  lines.forEach(function(l){var p=P(l.pid),al=allocFEFO(l.pid,l.qty);
   mv({pid:l.pid,type:'CONSIGN',qty:-l.qty,cost:p.cost,ref:no,lot:al.map(function(a){return lotName(a.lid)}).join(',')});
   db.consB.push({id:uid(),pt:id,pid:l.pid,rem:r3(l.qty),qty:r3(l.qty),price:r2(l.price),cost:r2(p.cost),alloc:al,no:no,at:at});
   tot+=l.qty*l.price});
  doc('OUT',id,no,at,lines,tot,note);
  audit('CONS_OUT','cons',no,null,{pt:pt.name,tot:r2(tot),n:lines.length},note);save();return no};

 window.consRet=function(id,lines,note){ini();need('cons.write');var pt=PT(id);
  if(!pt)throw new Error('ไม่พบพาร์ทเนอร์');if(!lines.length)throw new Error('ยังไม่มีรายการสินค้า');
  chkHeld(id,lines);var at=NOW(),no=docNo('CR'),tot=0;
  lines.forEach(function(l){take(id,l.pid,l.qty).forEach(function(t){releaseFEFO(t.alloc);
   mv({pid:l.pid,type:'CONS_RET',qty:t.qty,cost:t.cost,ref:no,rs:'รับคืนจาก '+pt.name});tot+=t.qty*t.price})});
  doc('RET',id,no,at,lines,tot,note);
  audit('CONS_RET','cons',no,null,{pt:pt.name,tot:r2(tot)},note);save();return no};

 window.consSell=function(id,lines,note){ini();need('cons.write');var pt=PT(id);
  if(!pt)throw new Error('ไม่พบพาร์ทเนอร์');if(!lines.length)throw new Error('ยังไม่มีรายการสินค้า');
  chkHeld(id,lines);var at=NOW(),no=docNo('SA'),L=[];
  lines.forEach(function(l){take(id,l.pid,l.qty).forEach(function(t){
   L.push({pid:l.pid,qty:t.qty,price:t.price,cost:t.cost,tot:r2(t.qty*t.price),cogs:r2(t.qty*t.cost),alloc:[]})})});
  var tot=r2(SUM(L,function(l){return l.tot})),cogs=r2(SUM(L,function(l){return l.cogs}));
  var useCom=pt.com==='Y'&&(pt.emp||'').trim();
  var s={id:uid(),no:no,at:at,chan:useCom?'EMP':'COMPANY',emp:useCom?pt.emp.trim():null,cid:pt.cid,items:L,tot:tot,cogs:cogs,
   paid:tot,status:'POSTED',note:'ฝากขาย '+pt.name+(note?' · '+note:''),uid:me.id,com:0,bon:0,comTot:0,credit:tot,cons:id};
  if(useCom){var tc=0,tb=0;L.forEach(function(l){var c=calcCom(P(l.pid),l.qty,l.tot);if(c.sum===0)return;
   tc=r2(tc+c.com);tb=r2(tb+c.bon);
   db.comms.push({id:uid(),at:at,sid:s.id,no:no,emp:s.emp,pid:l.pid,pname:P(l.pid).name,qty:l.qty,tot:l.tot,
    com:c.com,bon:c.bon,sum:c.sum,paid:false,payId:null,void:false})});
   s.com=tc;s.bon=tb;s.comTot=r2(tc+tb)}
  db.sales.push(s);
  db.pays.push({id:uid(),sid:s.id,aid:null,m:'CREDIT',amt:tot,ref:'',at:at});
  db.ar.push({id:uid(),no:docNo('AR'),sid:s.id,sno:no,cid:pt.cid,at:at,date:DAY(at),
   due:addDays(DAY(at),pt.days||0),amt:tot,paid:0,status:'OPEN',uid:me.id});
  db.inc.push({id:uid(),no:docNo('IN'),date:DAY(at),type:'SALES',desc:'รายได้ฝากขาย '+pt.name+' '+no,
   amt:tot,aid:db.accounts[0].id,ref:no,sid:s.id,auto:true,void:false,uid:me.id,at:at});
  doc('SOLD',id,no,at,lines,tot,note);
  audit('CONS_SOLD','sales',s.id,null,{no:no,pt:pt.name,tot:tot,gp:r2(tot-cogs),com:s.comTot},note);save();return no};

 var _vs=window.voidSale;
 if(typeof _vs==='function')window.voidSale=function(id){
  var s=db.sales.filter(function(x){return x.id===id})[0];
  if(s&&s.cons)throw new Error('บิลนี้มาจากใบตัดยอดฝากขาย ยกเลิกตรงนี้ไม่ได้ — ให้ใช้ "คืนของ" ที่หน้าฝากขายแทน');
  return _vs.apply(this,arguments)};

 /* ── UI ── */
 window.cPt=function(id){ini();var p=id?PT(id):{name:'',kind:'PARTNER',prov:'',pct:100,days:30,com:'N',emp:'',note:''};
  modal(id?'✏️ แก้ไขพาร์ทเนอร์':'➕ เพิ่มพาร์ทเนอร์ / ร้านใหญ่',
   '<label>ชื่อ</label><input id="pn" value="'+E(p.name)+'">'+
   '<label>ประเภท</label><select id="pk"><option value="PARTNER"'+(p.kind==='PARTNER'?' selected':'')+'>พาร์ทเนอร์ต่างจังหวัด</option>'+
   '<option value="KEY"'+(p.kind==='KEY'?' selected':'')+'>ร้านใหญ่ (Key Account)</option></select>'+
   '<label>จังหวัด</label><input id="pv" value="'+E(p.prov)+'">'+
   '<label>ราคาส่งให้ = ราคาปกติ × (%)</label><input id="pp" type="number" value="'+p.pct+'">'+
   '<label>เครดิต (วัน) หลังตัดยอดขาย</label><input id="pd" type="number" value="'+p.days+'">'+
   '<label>ค่าคอม/โบนัสจากยอดของรายนี้</label><select id="pc"><option value="N"'+(p.com==='N'?' selected':'')+'>ไม่มี</option>'+
   '<option value="Y"'+(p.com==='Y'?' selected':'')+'>มี (จ่ายให้พนักงานด้านล่าง)</option></select>'+
   '<label>พนักงานที่รับค่าคอม (ถ้ามี)</label><input id="pe" value="'+E(p.emp)+'" placeholder="เช่น EMP-014 สมหญิง">'+
   '<label>หมายเหตุ</label><input id="po" value="'+E(p.note)+'">',
   function(){need('cons.write');var n=V('pn');if(!n)throw new Error('ต้องระบุชื่อ');
    var o={name:n,kind:V('pk'),prov:V('pv'),pct:N('pp')||100,days:Math.max(0,Math.round(N('pd'))),com:V('pc'),emp:V('pe'),note:V('po')};
    if(o.com==='Y'&&!o.emp)throw new Error('เลือกมีค่าคอม ต้องระบุชื่อพนักงาน');
    if(id){for(var k in o)p[k]=o[k];var c=CU(p.cid);if(c&&c.active!==false){c.creditDays=p.days;c.name=p.name+(p.prov?' ('+p.prov+')':'')}
     audit('UPDATE_PARTNER','partners',id,null,o)}
    else{var cu={id:uid(),code:'PT-'+String(db.partners.length+1).padStart(3,'0'),name:n+(o.prov?' ('+o.prov+')':''),phone:'',
      addr:o.prov,grade:3,creditDays:o.days,creditLimit:0,black:false,blackRs:'',note:'พาร์ทเนอร์ฝากขาย',active:true};
     db.customers.push(cu);o.id=uid();o.cid=cu.id;o.active=true;db.partners.push(o);
     audit('CREATE_PARTNER','partners',o.id,null,{name:n,kind:o.kind,prov:o.prov})}
    save();shut();toast('บันทึกเรียบร้อย');render()})};

 window.cMod=function(k,id){ini();var pt=PT(id);if(!pt)return;CT={k:k,id:id,lines:[]};
  var ps=k==='OUT'?db.products.filter(function(p){return p.active!==false}):heldPids(id).map(P);
  if(!ps.length){toast('ไม่มีของฝากค้างอยู่','a');return}
  var opts=ps.map(function(p){return '<option value="'+p.id+'">'+E(p.name)+' · '+(k==='OUT'?'คลัง ':'ค้าง ')+
   Q(k==='OUT'?onh(p.id):heldQty(id,p.id))+'</option>'}).join('');
  modal({OUT:'📤 ส่งของฝากขาย',SOLD:'💰 ตัดยอดที่ขายได้',RET:'↩️ รับคืนของ'}[k]+' — '+E(pt.name),
   '<label>สินค้า</label><select id="cp" onchange="cSync()">'+opts+'</select>'+
   '<div class="row"><div style="flex:1"><label>จำนวน</label><input id="cq" type="number" inputmode="decimal"></div>'+
   (k==='OUT'?'<div style="flex:1"><label>ราคา/หน่วย</label><input id="cpr" type="number" inputmode="decimal"></div>':'')+'</div>'+
   (k==='SOLD'?'<p class="mu" style="margin-top:6px">ราคาใช้ตามที่ล็อกไว้ตอนส่งฝาก</p>':'')+
   '<button class="btn o full" style="margin-top:9px" onclick="cAdd()">➕ เพิ่มรายการ</button><div id="cl" style="margin-top:9px"></div>'+
   '<label>หมายเหตุ</label><input id="cn">',
   function(){var f={OUT:consOut,SOLD:consSell,RET:consRet}[CT.k];
    if(!CT.lines.length)throw new Error('กด "➕ เพิ่มรายการ" ก่อนบันทึก');
    var no=f(CT.id,CT.lines,V('cn'));shut();toast('บันทึกเรียบร้อย '+no);render()},'✅ ยืนยัน');
  cSync();cDraw()};
 window.cSync=function(){var pt=PT(CT.id),e=$('cpr');if(e&&pt)e.value=r2(P(V('cp')).price*(pt.pct||100)/100)};
 window.cAdd=function(){var pid=V('cp'),q=N('cq'),pr=CT.k==='OUT'?N('cpr'):0;
  if(!pid||q<=0){toast('ระบุสินค้าและจำนวน','r');return}
  CT.lines.push({pid:pid,qty:q,price:pr});$('cq').value='';cDraw()};
 window.cDel=function(i){CT.lines.splice(i,1);cDraw()};
 function cDraw(){var e=$('cl');if(!e)return;
  e.innerHTML=CT.lines.length?CT.lines.map(function(l,i){return '<div class="ln"><div class="x"><b>'+E(P(l.pid).name)+'</b>'+
   '<div class="mu">'+Q(l.qty)+' '+E(P(l.pid).unit)+(CT.k==='OUT'?' × '+B(l.price)+' = '+B(l.qty*l.price):'')+'</div></div>'+
   '<button class="btn r xs" onclick="cDel('+i+')">ลบ</button></div>'}).join(''):'<p class="mu">— ยังไม่มีรายการ —</p>'}
 window.cDet=function(id){var pt=PT(id),bs=bsOf(id);
  modal('📦 ของฝากค้างที่ '+E(pt.name),'<div class="tw"><table style="min-width:auto"><thead><tr><th>สินค้า</th><th class="num">ค้าง</th>'+
   '<th class="num">ราคา</th><th>เลขที่</th><th>ส่งเมื่อ</th></tr></thead><tbody>'+(bs.length?bs.map(function(b){
   return '<tr><td>'+E(P(b.pid).name)+'</td><td class="num">'+Q(b.rem)+'</td><td class="num">'+B(b.price)+'</td><td class="mu">'+E(b.no)+
   '</td><td class="mu">'+DT(b.at)+'</td></tr>'}).join(''):'<tr><td colspan="5" class="emp">ไม่มีของค้าง</td></tr>')+'</tbody></table></div>')};

 VIEWS.cons=function(){ini();
  if(!can('cons.read'))return '<div class="card"><div class="emp">🔒 ไม่มีสิทธิ์</div></div>';
  var W=can('cons.write'),h=[],tq=0,tv=0,ta=0,rows=[];
  db.partners.forEach(function(p){var bs=bsOf(p.id),q=r3(SUM(bs,function(b){return b.rem})),
   sv=r2(SUM(bs,function(b){return b.rem*b.price})),cv=r2(SUM(bs,function(b){return b.rem*b.cost})),ar=custOut(p.cid);
   tq+=q;tv+=sv;ta+=ar;
   rows.push('<tr><td><b>'+E(p.name)+'</b><div class="mu">'+E(KIND[p.kind]||'')+' · '+E(p.prov||'-')+' · ราคา '+p.pct+'%'+
    (p.com==='Y'?' · คอม→'+E(p.emp):'')+'</div></td><td class="num">'+Q(q)+'</td><td class="num">'+B(sv)+
    '<div class="mu">ทุน '+B(cv)+'</div></td><td class="num" style="font-weight:700;color:'+(ar>0?'var(--rd)':'var(--gr)')+'">'+B(ar)+'</td><td>'+
    '<button class="btn o xs" onclick="cDet(\''+p.id+'\')">ดูของ</button>'+
    (W?' <button class="btn xs" onclick="cMod(\'OUT\',\''+p.id+'\')">ส่งฝาก</button> <button class="btn g xs" onclick="cMod(\'SOLD\',\''+p.id+
    '\')">ตัดยอด</button> <button class="btn o xs" onclick="cMod(\'RET\',\''+p.id+'\')">คืน</button> <button class="btn o xs" onclick="cPt(\''+p.id+'\')">แก้ไข</button>':'')+'</td></tr>')});
  h.push('<div class="card"><h2>🤝 ฝากขาย — พาร์ทเนอร์ & ร้านใหญ่</h2><div class="grid g3">'+st('ของฝากค้างรวม',Q(tq),'หน่วย','pu')+
   st('มูลค่าตามราคาส่ง',B(tv),'','bl')+st('ลูกหนี้ค้างเก็บ',B(ta),'','rd')+'</div>'+
   (W?'<button class="btn" style="margin-top:12px" onclick="cPt()">➕ เพิ่มพาร์ทเนอร์ / ร้านใหญ่</button>':'')+'</div>');
  h.push('<div class="card"><div class="tw"><table><thead><tr><th>พาร์ทเนอร์</th><th class="num">ของค้าง</th><th class="num">มูลค่า</th>'+
   '<th class="num">ค้างชำระ</th><th></th></tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="5" class="emp">ยังไม่มีพาร์ทเนอร์</td></tr>')+
   '</tbody></table></div><p class="mu" style="margin-top:9px">💡 ตัดยอดแล้วจะเกิดรายได้และลูกหนี้ทันที รับชำระที่เมนู 💳 ลูกหนี้</p></div>');
  h.push('<div class="card"><h2>📜 เอกสารล่าสุด</h2><div class="tw"><table><thead><tr><th>เลขที่</th><th>เวลา</th><th>พาร์ทเนอร์</th><th>ประเภท</th>'+
   '<th class="num">รายการ</th><th class="num">มูลค่า</th></tr></thead><tbody>'+(db.cons.length?db.cons.slice().reverse().slice(0,30).map(function(d){
   var x=DK[d.k]||[d.k,'g-s'],p=PT(d.pt);return '<tr><td><b>'+E(d.no)+'</b></td><td class="mu">'+DT(d.at)+'</td><td>'+E(p?p.name:'-')+
   '</td><td><span class="tg '+x[1]+'">'+x[0]+'</span></td><td class="num">'+d.n+'</td><td class="num">'+B(d.tot)+'</td></tr>'}).join(''):
   '<tr><td colspan="6" class="emp">ยังไม่มีเอกสาร</td></tr>')+'</tbody></table></div></div>');
  return h.join('')};

 if(!PAGES.some(function(x){return x[0]==='cons'})){
  var ix=-1;PAGES.forEach(function(x,i){if(x[0]==='comm')ix=i});
  PAGES.splice(ix<0?PAGES.length:ix+1,0,['cons','🤝 ฝากขาย'])}
 console.log('%c✅ v5.4 ฝากขาย/พาร์ทเนอร์ โหลดสำเร็จ','color:#7c3aed;font-weight:bold');
 setTimeout(function(){try{var a=$('app');if(window.db&&a&&!a.classList.contains('hide'))render()}catch(e){}},200);
})();
